<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tres y Punto · Sistema de Gestión</title>
<style>
  :root{
    --orange:#FF5A1F;
    --orange-d:#E04A12;
    --orange-l:#FF7A47;
    --celeste:#75AADB;
    --celeste-d:#5790c4;
    --ink:#1d1f24;
    --muted:#6b7280;
    --line:#e6e8ec;
    --bg:#f4f5f7;
    --card:#ffffff;
    --ok:#1f9d55;
    --warn:#e0a100;
    --bad:#d83a34;
    --shadow:0 1px 3px rgba(20,22,28,.08),0 6px 20px rgba(20,22,28,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .hidden{display:none!important}

  /* LOGIN */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));padding:20px;z-index:50}
  .login-card{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
  .brandmark{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo3{width:48px;height:48px;border-radius:12px;background:#fff;border:2px solid var(--orange);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--orange);line-height:1}
  .wordmark{font-weight:800;font-size:20px;letter-spacing:.2px}
  .wordmark .o{color:var(--orange)}
  .login-sub{color:var(--muted);font-size:13px;margin:2px 0 22px}
  .userpick{display:grid;gap:8px;margin-bottom:16px}
  .userbtn{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;text-align:left;transition:.12s}
  .userbtn:hover{border-color:var(--orange);background:#fff7f3}
  .userbtn.sel{border-color:var(--orange);background:#fff3ec;box-shadow:0 0 0 3px rgba(255,90,31,.12)}
  .userbtn b{font-size:15px}
  .roletag{font-size:11px;color:#fff;background:var(--celeste);padding:2px 8px;border-radius:20px;font-weight:600}
  .roletag.gerente{background:var(--orange)}
  .roletag.supervisor{background:var(--celeste-d)}
  .roletag.propietario{background:var(--orange)}
  .pinbox{display:flex;gap:8px;justify-content:center;margin:10px 0 4px}
  .pinbox input{width:100%;text-align:center;letter-spacing:8px;font-size:22px;padding:12px;border:1.5px solid var(--line);border-radius:12px}
  .pinbox input:focus{outline:none;border-color:var(--orange)}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

  /* APP SHELL */
  #app{display:flex;min-height:100vh}
  .side{width:236px;background:linear-gradient(180deg,var(--orange),var(--orange-d));color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side-head{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.18)}
  .side-head .logo3{width:38px;height:38px;font-size:21px;border-radius:10px}
  .side-head .nm{font-weight:800;font-size:16px;color:#fff}
  .nav{padding:10px 10px;overflow-y:auto;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;color:rgba(255,255,255,.92);text-decoration:none;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;margin-bottom:2px;transition:.1s}
  .nav a .ic{width:20px;text-align:center;font-size:16px}
  .nav a:hover{background:rgba(255,255,255,.14)}
  .nav a.active{background:#fff;color:var(--orange);font-weight:700}
  .navgrp-head{display:flex;align-items:center;gap:11px;color:rgba(255,255,255,.92);text-decoration:none;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:2px}
  .navgrp-head:hover{background:rgba(255,255,255,.14)}
  .navgrp-head .ic{width:20px;text-align:center;font-size:16px}
  .navgrp-head .chev{transition:.15s;font-size:13px;opacity:.8}
  .navgrp.open .navgrp-head .chev{transform:rotate(180deg)}
  .navgrp-body{display:none;margin:0 0 4px 14px;padding-left:8px;border-left:1px solid rgba(255,255,255,.2)}
  .navgrp.open .navgrp-body{display:block}
  .nav a.sub{font-size:13.5px;padding:8px 12px}
  .side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px}
  .side-foot .who{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .side-foot button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
  .side-foot button:hover{background:rgba(255,255,255,.28)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar h1{margin:0;font-size:19px;font-weight:800}
  .topbar .turnostate{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .dot.on{background:var(--ok)}
  .content{padding:24px 26px;flex:1}

  /* COMPONENTS */
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
  .kpi.cel::before{background:var(--celeste)}
  .kpi.ok::before{background:var(--ok)}
  .kpi.bad::before{background:var(--bad)}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:4px;line-height:1.1}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-h h3{margin:0;font-size:15px;font-weight:700}
  .card-b{padding:16px 18px}
  .card-b.flush{padding:0}

  .btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;transition:.1s}
  .btn:hover{background:var(--orange-d)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .btn.gh{background:#fff;color:var(--orange);border:1.5px solid var(--orange)}
  .btn.gh:hover{background:#fff5f0}
  .btn.cel{background:var(--celeste)}
  .btn.cel:hover{background:var(--celeste-d)}
  .btn.gray{background:#eef0f3;color:var(--ink)}
  .btn.gray:hover{background:#e2e5ea}
  .btn.danger{background:var(--bad)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;background:#fafbfc;position:sticky;top:0}
  tbody tr:hover{background:#fafbfc}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl-wrap{max-height:none;overflow:auto}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .badge.ok{background:#e6f6ec;color:var(--ok)}
  .badge.warn{background:#fdf3d6;color:#9a7400}
  .badge.bad{background:#fde7e6;color:var(--bad)}
  .badge.cel{background:#e9f1fa;color:var(--celeste-d)}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink)}
  .field input,.field select,.field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .search{flex:1;min-width:200px}
  .toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(20,22,28,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .modal.wide{max-width:760px}
  .modal-h{padding:16px 20px;border-bottom:none;display:flex;align-items:center;justify-content:space-between;background:var(--orange)}
  .modal-h h3{margin:0;font-size:17px;color:#fff}
  .modal-h .x{background:none;border:none;font-size:22px;color:#fff;opacity:.92;line-height:1}
  .modal-b{padding:20px;background:#fff3ec}
  .modal-f{padding:14px 20px;border-top:1px solid #f3d8c8;display:flex;justify-content:flex-end;gap:10px;background:#fff3ec}
  .modal-b .field input,.modal-b .field select,.modal-b .field textarea{box-shadow:0 1px 3px rgba(20,22,28,.10)}
  .modal-b .field input:focus,.modal-b .field select:focus,.modal-b .field textarea:focus{border-color:var(--orange)}

  /* POS */
  .pos{display:grid;grid-template-columns:minmax(220px,0.72fr) minmax(500px,1.28fr);gap:18px;align-items:start}
  .pos-search input{font-size:14px;padding:9px 12px}
  .pos-results{margin-top:10px;display:grid;gap:6px;max-height:560px;overflow:auto}
  .pos-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff;cursor:pointer;transition:.1s}
  .pos-item:hover{border-color:var(--orange);background:#fff7f3}
  .pos-item .meta{font-size:12px;color:var(--muted)}
  .pos-grid{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:calc(100vh - 250px);overflow:auto;align-content:start}
  .pcard{border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:.1s}
  .pcard:hover{border-color:var(--orange);box-shadow:0 6px 16px rgba(0,0,0,.09);transform:translateY(-1px)}
  .pcard .ph{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f2ede7;display:flex;align-items:center;justify-content:center;font-size:34px;color:#c9bfb4}
  .pcard .bd{padding:7px 8px;display:flex;flex-direction:column;gap:2px}
  .pcard .nm{font-weight:700;font-size:12px;line-height:1.25;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .pr{font-weight:800;font-size:14px}
  .pcard .st{font-size:10.5px;color:var(--muted)}
  .cart{border:2px solid var(--orange)!important;box-shadow:0 12px 36px rgba(255,90,31,.16);display:flex;flex-direction:column;flex:1;min-height:0}
  .cart .card-b{display:flex;flex-direction:column;flex:1;min-height:0}
  .pos-full{display:flex;flex-direction:column;gap:12px;height:calc(100vh - 118px);min-height:440px}
  .pos-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 0 auto}
  .pbtn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:.1s;white-space:nowrap}
  .pbtn:hover{border-color:var(--orange);color:var(--orange)}
  .pbtn .pi{font-size:16px;line-height:1}
  .pbtn kbd{font-size:10.5px;background:#f0ece6;border:1px solid var(--line);border-radius:5px;padding:2px 5px;font-family:monospace;color:var(--muted);font-weight:700}
  .pbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .pbtn.primary:hover{background:var(--orange-d,#E04612);color:#fff}
  .pbtn.primary kbd{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
  .pbtn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .pbtn-sep{width:1px;height:26px;background:var(--line);margin:0 3px}
  .pos-footer{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 20px;box-shadow:0 -2px 12px rgba(0,0,0,.04)}
  .pos-footer .cart-total{margin:0;padding:0;border-top:0;gap:14px;align-items:baseline}
  .pos-footer .btn{padding:14px 34px;font-size:17px}
  .modal.xl{max-width:1080px}
  .modal .pos-search input{font-size:18px;padding:14px 16px}
  .modal .pos-grid{max-height:52vh}
  .modal .pos-results{max-height:52vh}
  .pos-item.hl,.pcard.hl{outline:3px solid var(--orange);outline-offset:-1px;background:#fff3ec}
  .pf-tabs{display:flex;gap:8px;margin-bottom:12px}
  .scanchip{display:none;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:10px;background:#e8f1fb;border:1.5px solid #2E86DE;color:#1b5c96;font-weight:700;font-family:monospace;font-size:14px;letter-spacing:.04em}
  .scanchip.on{display:inline-flex}
  .bigalert{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.45);pointer-events:none}
  .bigalert.on{display:flex}
  .bigalert span{background:var(--bad);color:#fff;padding:34px 58px;border-radius:18px;font-size:clamp(30px,6vw,62px);font-weight:900;letter-spacing:.03em;text-align:center;line-height:1.1;box-shadow:0 22px 60px rgba(0,0,0,.4);animation:baPop .14s ease-out}
  @keyframes baPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .pcard.nostock{opacity:.55}
  .pcard.nostock .nm{text-decoration:line-through}
  .cart .card-h{background:var(--orange);border-bottom:none;border-radius:14px 14px 0 0}
  .cart .card-h h3{color:#fff;font-size:18px}
  .cart .card-h .btn.gray{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
  .cart .card-b{padding:16px 16px 18px}
  .cart-lines{flex:1;overflow:auto;min-height:0}
  .ticket-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .ttab{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);user-select:none}
  .ttab.sel{border-color:var(--orange);background:#fff3ec;color:var(--orange)}
  .ttab .ttn{background:var(--orange);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700}
  .ttab .ttx{color:var(--muted);font-weight:700;margin-left:2px}
  .ttab .ttx:hover{color:var(--bad)}
  .ttab.add{border-style:dashed;color:var(--muted)}
  .selbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:12px;flex-wrap:wrap}
  .selcirc{width:18px;height:18px;border-radius:50%;border:2px solid #c9c2b8;display:inline-block;cursor:pointer;flex:0 0 18px;position:relative;vertical-align:middle;background:#fff;transition:.1s}
  .selcirc:hover{border-color:#2E86DE}
  .selcirc.on{background:#2E86DE;border-color:#2E86DE}
  .selcirc.on::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  tr.selrow{background:#e8f1fb}
  #invBody tr.selrow{background:#e8f1fb}
  #invBody tr.selrow:hover{background:#dceaf8}
  th.selcol,td.selcol{width:36px;text-align:center;padding-left:10px;padding-right:4px}
  .sellabel{cursor:pointer;user-select:none;font-size:13.5px;font-weight:600;color:var(--ink)}
  .cart-tbl{width:100%;border-collapse:collapse}
  .cart-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line)}
  .cart-tbl th.num,.cart-tbl td.num{text-align:right}
  .cart-tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
  .cline-row{cursor:pointer;transition:background .08s}
  .cline-row:hover{background:#faf7f3}
  .cline-row.sel{background:#fff3ec;box-shadow:inset 3px 0 0 var(--orange)}
  .cart-tbl .c-name b{font-weight:700;line-height:1.25;display:block;word-break:break-word}
  .cart-tbl .c-imp{font-weight:800;user-select:none;font-size:15px}
  .cart-tbl .c-price{white-space:nowrap}
  .cart-tbl .price-show{cursor:pointer;user-select:none;font-weight:800;color:var(--orange-d,#E04612);border-bottom:1px dashed var(--orange);padding-bottom:1px}
  .cart-tbl .price-inp input{width:90px;text-align:right;border:1.5px solid var(--orange);border-radius:7px;padding:5px 6px;font-weight:800;font-size:14px;background:#fff8f4}
  .qty2{display:inline-flex;align-items:center;gap:6px}
  .qty2 button{width:28px;height:28px;border:1.5px solid var(--line);background:#fff;border-radius:7px;font-size:16px;font-weight:700;cursor:pointer;line-height:1;color:var(--ink)}
  .qty2 button:hover{border-color:var(--orange);color:var(--orange)}
  .qty2 .qn{min-width:26px;text-align:center;font-weight:700}
  .cart-tbl .rm{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  .cart-tbl .rm:hover{color:var(--bad)}
  .cline{display:flex;gap:13px;padding:15px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
  .cline .cimg{width:74px;height:74px;flex:0 0 74px;border-radius:12px;object-fit:cover;background:#f2ede7;display:flex;align-items:center;justify-content:center;font-size:30px;color:#c9bfb4}
  .cline .cmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .cline .nm b{display:block;font-size:16.5px;font-weight:800;line-height:1.3;white-space:normal;word-break:break-word}
  .cline .nm span{font-size:12px;color:var(--muted)}
  .cline .crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cline .price-edit{font-size:12.5px;color:var(--orange-d,#E04612);font-weight:700;display:flex;align-items:center;gap:4px}
  .cline .price-edit input{width:100px;text-align:right;border:1.5px solid var(--orange);border-radius:8px;padding:7px 8px;font-weight:800;color:var(--ink);font-size:15px;background:#fff8f4}
  .cline .price-show{cursor:pointer;user-select:none;font-weight:700}
  .cline .price-inp{align-items:center;gap:3px}
  .cline .cright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:76px}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:700;font-size:16px;line-height:1;cursor:pointer}
  .qty input{width:46px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:5px}
  .cline .lt{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
  .cline .rm{border:none;background:none;color:var(--bad);font-size:19px;cursor:pointer;line-height:1}
  .cart-total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0;padding-top:12px;border-top:2px solid var(--ink)}
  .cart-total .t{font-size:13px;color:var(--muted);font-weight:600}
  .cart-total .v{font-size:36px;font-weight:800;color:var(--orange)}
  .pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
  .pm{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-size:13px;font-weight:600;text-align:center}
  .pm.sel{border-color:var(--orange);background:#fff3ec;color:var(--orange)}
  .checkout-total{text-align:center;font-size:46px;font-weight:800;color:var(--orange);letter-spacing:-1px;margin:6px 0 0;font-variant-numeric:tabular-nums;line-height:1}
  .pay-big{grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  .pay-big .pm{padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;cursor:pointer}
  .pay-big .pm .pmi{font-size:30px;line-height:1}
  @media(max-width:560px){ .pay-big{grid-template-columns:1fr 1fr} }
  .empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:13.5px}
  .empty .big{font-size:34px;margin-bottom:6px}

  .trz-choice{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px}
  .trz-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;cursor:pointer;transition:.12s;box-shadow:0 3px 12px rgba(0,0,0,.05)}
  .trz-card:hover{border-color:var(--orange);box-shadow:0 8px 24px rgba(255,90,31,.14);transform:translateY(-2px)}
  .trz-card .ico{font-size:44px;line-height:1}
  .trz-card h3{margin:12px 0 6px;font-size:19px}
  .trz-card p{color:var(--muted);font-size:13.5px;margin:0}
  @media(max-width:640px){.trz-choice{grid-template-columns:1fr}}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .team-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.05)}
  .tc-av{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800}
  .tc-name{font-weight:800;font-size:16px}
  .tc-role{margin-top:8px}
  .help{background:#e9f1fa;border:1px solid #cfe0f2;color:#2c5d86;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:80;animation:pop .2s}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
  .toast.bad{background:var(--bad)}
  .toast.ok{background:var(--ok)}

  .mini{font-size:12px;color:var(--muted)}
  .right{text-align:right}
  .sectitle{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px}

  #printArea{display:none}
  @media print{
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:10px}
    .ticket{font-family:"Courier New",monospace;font-size:12px;max-width:300px;margin:0 auto}
    .ticket h2{text-align:center;margin:2px 0}
    .ticket .ln{display:flex;justify-content:space-between}
    .ticket hr{border:none;border-top:1px dashed #000;margin:6px 0}
    .rpt{font-size:12px}
    .rpt h2{margin:4px 0}
    .rpt table{width:100%;border-collapse:collapse}
    .rpt th,.rpt td{border:1px solid #999;padding:3px 6px;font-size:11px}
  }
  @media (max-width:880px){
    .side{position:fixed;left:-240px;z-index:40;transition:.2s}
    .side.open{left:0}
    .pos{grid-template-columns:1fr}
    .cart{position:static}
  }
  .cloudbg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--orange),var(--orange-d));padding:20px;z-index:70}
  #cloudOverlay{display:none}
</style>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="brandmark"><div class="logo3">3·</div><div class="wordmark">Tres y <span class="o">Punto</span></div></div>
    <div class="login-sub">Sistema de gestión · Drugstore nocturno</div>
    <div class="userpick" id="userpick"></div>
    <div class="pinbox"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%" id="loginBtn">Ingresar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="side-head"><div class="logo3">3·</div><div class="nm">Tres y Punto</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who"><span id="whoName">—</span><button id="logoutBtn">Salir</button></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn gray sm" id="menuToggle" style="display:none">☰</button>
        <h1 id="pageTitle">Panel</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px"><span id="syncBadge" class="mini"></span><div class="turnostate" id="turnoState"></div></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="cloudOverlay"></div>
<div id="printArea"></div>

<script>
"use strict";
/* =========================================================
   TRES Y PUNTO · Sistema de gestión (single-file, offline)
   Datos en IndexedDB (en esta máquina/navegador).
   ========================================================= */

/* ---------- Capa de datos en la NUBE (Firestore + tiempo real) ---------- */
const STORES = ["products","sales","shifts","cashCloses","expenses","users","priceHistory","purchases","suppliers","combos","movimientos","ajustes","inversiones","perdidas","activos","aportes","concesiones","papelera","meta"];
const MIRROR = {}; STORES.forEach(s=>MIRROR[s]=[]);
let _db=null, _auth=null, _ready=false;
const _firstSnap={};
const DB = {
  STORES,
  all(s){ return Promise.resolve((MIRROR[s]||[]).map(x=>({...x}))); },
  get(s,id){ const f=(MIRROR[s]||[]).find(x=>x.id===String(id)); return Promise.resolve(f?{...f}:undefined); },
  put(s,obj){
    obj=JSON.parse(JSON.stringify(obj)); if(obj.id==null) obj.id=uid(); obj.id=String(obj.id);
    const arr=MIRROR[s]||(MIRROR[s]=[]); const i=arr.findIndex(x=>x.id===obj.id);
    if(i>=0) arr[i]=obj; else arr.push(obj);                 // optimista (se ve al instante)
    if(_db) _db.collection(s).doc(obj.id).set(obj).catch(e=>console.error("put",s,e));
    return Promise.resolve(obj);
  },
  del(s,id){ id=String(id); MIRROR[s]=(MIRROR[s]||[]).filter(x=>x.id!==id); if(_db) _db.collection(s).doc(id).delete().catch(e=>console.error("del",s,e)); return Promise.resolve(); },
  async clear(s){ MIRROR[s]=[]; if(_db){ const snap=await _db.collection(s).get(); let b=_db.batch(),n=0; for(const d of snap.docs){ b.delete(d.ref); if(++n>=450){ await b.commit(); b=_db.batch(); n=0; } } if(n>0) await b.commit(); } }
};
function startListeners(){
  STORES.forEach(s=>{
    _db.collection(s).onSnapshot(snap=>{
      MIRROR[s]=snap.docs.map(d=>{ const o=d.data(); if(o.id==null) o.id=d.id; o.id=String(o.id); return o; });
      _firstSnap[s]=true;
      updateSyncBadge(snap.metadata);
      if(_ready) scheduleRerender();
    }, err=>console.error("listen "+s, err));
  });
}
function scheduleRerender(){
  if(!APP.user) return;
  const mr=$("modalRoot"); if(mr && mr.innerHTML.trim()) return;        // no molestar si hay un cuadro abierto
  if(APP.page!=="dashboard" && APP.page!=="ventas") return;             // solo refrescamos en vivo las pantallas de monitoreo
  if(window._rr) clearTimeout(window._rr);
  window._rr=setTimeout(()=>{ if(APP.user && (APP.page==="dashboard"||APP.page==="ventas")) go(APP.page); }, 600);
}
function waitFirst(keys,timeout){
  return new Promise(res=>{ const t0=Date.now(); const iv=setInterval(()=>{ if(keys.every(k=>_firstSnap[k]) || Date.now()-t0>(timeout||8000)){ clearInterval(iv); res(); } },120); });
}
async function startData(){ startListeners(); await waitFirst(["users","products","meta"]); }
function updateSyncBadge(meta){
  const el=$("syncBadge"); if(!el) return;
  if(!navigator.onLine || (meta&&meta.fromCache)) el.innerHTML='<span class="badge warn">offline · se sincroniza al volver</span>';
  else el.innerHTML='<span class="badge ok">● en vivo</span>';
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => "$" + (Math.round((+n||0)*100)/100).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:2});
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmtDateTime = iso => { const d=new Date(iso); return d.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); };
const fmtDate = iso => new Date(iso).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
const sameDay = (iso,day) => iso && iso.slice(0,10)===day;

function mesLabel(ym){ const M=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]; if(!ym) return ""; const y=ym.slice(0,4),mm=+ym.slice(5,7); return (M[mm-1]||ym)+" "+y; }
function _autoCap(el){
  const v=el.value; if(!v) return;
  const nv=v.replace(/(^|\s)([\wáéíóúüñ])/g,(m,p1,p2)=>p1+p2.toUpperCase());
  if(nv!==v){ const pos=el.selectionStart; el.value=nv; try{el.setSelectionRange(pos,pos);}catch(e){} }
}
if(!window.__autoCapOn){
  window.__autoCapOn=true;
  document.addEventListener("input",e=>{
    const el=e.target; if(!el || el.tagName!=="INPUT") return;
    const t=(el.getAttribute("type")||"text").toLowerCase();
    if(["password","email","url","number","date","tel","time"].includes(t)) return;
    const im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im==="decimal"||im==="numeric") return;
    const id=(el.id||"").toLowerCase();
    if(id.includes("search")||id.includes("scan")||id.includes("pin")||id.includes("pass")||id.includes("cod")||id.includes("config")||id.includes("iva")||id.includes("plazo")||id.includes("dias")||id.includes("monto")||id.includes("total")||id.includes("precio")||id.includes("costo")||id.includes("cant")) return;
    if(el.dataset && el.dataset.nocap!==undefined) return;
    _autoCap(el);
  });
}

  const t=document.createElement("div"); t.className="toast"+(type?" "+type:""); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);

const BANK_METHODS=["transferencia","tarjeta","debito","credito"];
function purchaseSubtotal(p){ if(p.items&&p.items.length) return p.items.reduce((a,i)=>a+i.cant*(+i.costoUnit||0),0); return (+p.subtotal||+p.total||0); }
function purchaseTotal(p){ if(!(p.items&&p.items.length)) return Math.round((+p.total||+p.subtotal||0)*100)/100; const sub=purchaseSubtotal(p); return Math.round((sub*(1+(p.iva||0)/100)+(p.envio||0))*100)/100; }
function shiftBoxes(turnoId, sales, expenses, purchases, movs){
  let vF=0,vB=0,eF=0,eB=0,enF=0;
  (sales||[]).filter(s=>s.turnoId===turnoId&&!s.anulada).forEach(s=>(s.pagos||[{metodo:s.metodoPago,monto:s.total}]).forEach(p=>{ if(p.metodo==="efectivo")vF+=p.monto; else if(BANK_METHODS.includes(p.metodo))vB+=p.monto; }));
  (expenses||[]).filter(e=>e.turnoId===turnoId).forEach(e=>{ if(e.caja==="bancaria")eB+=e.monto; else eF+=e.monto; });
  (purchases||[]).forEach(p=>{
    if(p.formaPago!=="credito" && p.turnoId===turnoId){ const m=purchaseTotal(p); if(p.caja==="bancaria")eB+=m; else eF+=m; }
    else if(p.formaPago==="credito" && p.pagada && p.paidTurnoId===turnoId){ const m=purchaseTotal(p); if(p.paidCaja==="bancaria")eB+=m; else eF+=m; }
  });
  (movs||[]).filter(m=>m.turnoId===turnoId).forEach(m=>{ if(m.tipo==="entrada") enF+=m.monto; else if(m.caja==="bancaria")eB+=m.monto; else eF+=m.monto; });
  return {ventasFisica:vF,ventasBancaria:vB,egresosFisica:eF,egresosBancaria:eB,entradasFisica:enF};
}

async function _nukeCollection(name){
  if(typeof _db!=="undefined" && _db){
    for(let i=0;i<12;i++){
      let snap;
      try{ snap=await _db.collection(name).get({source:"server"}); }
      catch(e){ try{ snap=await _db.collection(name).get(); }catch(e2){ break; } }
      if(snap.empty){ if(typeof MIRROR!=="undefined") MIRROR[name]=[]; return; }
      let b=_db.batch(),n=0;
      for(const d of snap.docs){ b.delete(d.ref); if(++n>=400){ await b.commit(); b=_db.batch(); n=0; } }
      if(n>0) await b.commit();
    }
    if(typeof MIRROR!=="undefined") MIRROR[name]=[];
  } else {
    await DB.clear(name);
  }
}

  const margenDia=ventasDia-costoDia;
  const margenPct=ventasDia>0?(margenDia/ventasDia*100):0;
  const nTx=todaySales.length;

      <div class="kpi ok"><div class="lab">Margen bruto hoy</div><div class="val">${money(margenDia)}</div><div class="sub">${margenPct.toFixed(1)}% sobre ventas</div></div>
      <div class="kpi cel"><div class="lab">💵 Caja (efectivo)</div><div class="val">${money(cajaFisica)}</div><div class="sub">turno actual</div></div>
      <div class="kpi ${bajos.length?"bad":""}"><div class="lab">Bajo stock mínimo</div><div class="val">${bajos.length}</div><div class="sub">productos a reponer</div></div>
    </div>

    <div class="grid" style="grid-template-columns:1.3fr 1fr;margin-top:18px">
      <div class="card">
        <div class="card-h"><h3>Más vendidos hoy</h3><span class="mini">por unidades</span></div>
        <div class="card-b flush">
          ${topArr.length?`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="num">Unid.</th><th class="num">$ vendido</th></tr></thead><tbody>
          ${topArr.map(t=>`<tr><td>${esc(t.desc)}</td><td class="num">${t.cant}</td><td class="num">${money(t.monto)}</td></tr>`).join("")}
          </tbody></table></div>`:`<div class="empty"><div class="big">🌙</div>Todavía no hubo ventas hoy.</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>A reponer</h3><span class="mini">stock ≤ mínimo</span></div>
        <div class="card-b flush">
          ${bajos.length?`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="num">Stock</th><th class="num">Mín</th></tr></thead><tbody>
          ${bajos.slice(0,10).map(p=>`<tr><td>${esc(p.descripcion)}</td><td class="num"><span class="badge ${p.stock===0?"bad":"warn"}">${p.stock}</span></td><td class="num">${p.stockMin}</td></tr>`).join("")}

        </div>
      </div>
    </div>

    <div class="grid kpis" style="margin-top:18px">
      <div class="kpi"><div class="lab">Gastos de hoy</div><div class="val">${money(gastosDia)}</div></div>
      <div class="kpi"><div class="lab">Resultado del día</div><div class="val" style="color:${(margenDia-gastosDia)>=0?"var(--ok)":"var(--bad)"}">${money(margenDia-gastosDia)}</div><div class="sub">margen − gastos</div></div>
      <div class="kpi"><div class="lab">Productos activos</div><div class="val">${APP.products.length}</div></div>

function payOf(sale,metodo){
  if(sale.pagos&&sale.pagos.length) return sale.pagos.filter(p=>p.metodo===metodo).reduce((a,p)=>a+p.monto,0);
  return sale.metodoPago===metodo?sale.total:0;
}

      }
    });

const POS={method:"efectivo",mixto:null,cliente:"",creditoUser:null,searchMode:"producto",_results:[],_idx:0,_scan:"",_scanT:0,_scanTimer:null};
function bigAlert(msg,ms){
  let el=$("bigAlert");
  if(!el){ el=document.createElement("div"); el.id="bigAlert"; el.className="bigalert"; document.body.appendChild(el); }
  el.innerHTML="<span></span>"; el.firstChild.textContent=msg;

}
function stockDisponible(productId){
  const p=APP.products.find(x=>x.id===productId);
  if(!p) return 0;
  const need=cartNeed();
  return p.stock-(need[productId]||0);
}
function showScanChip(txt){
  const el=$("scanChip"); if(!el) return;
  if(txt){ el.textContent="\u2328 "+txt; el.classList.add("on"); }
  else { el.textContent=""; el.classList.remove("on"); }
}
function scanCodigo(code){
  const c=String(code||"").trim(); if(!c) return;
  const norm=s=>String(s==null?"":s).trim();
  let p=APP.products.find(x=>norm(x.codigo)===c);
  if(!p) p=APP.products.find(x=>norm(x.codigo).toLowerCase()===c.toLowerCase());
  if(!p) p=APP.products.find(x=>norm(x.codigo).replace(/^0+/,"")===c.replace(/^0+/,"") && norm(x.codigo)!=="");
  if(p){ if(addToCart(p)) toast(p.descripcion,"ok"); }
  else { bigAlert("PRODUCTO NO ENCONTRADO"); }

function cartNeed(){
  const need={};
  APP.cart.forEach(l=>(l.descuentos||[]).forEach(d=>{ need[d.productId]=(need[d.productId]||0)+d.cant*l.cant; }));
  return need;
}
function lineRestante(l, need){
  const ds=l.descuentos||[];
  if(!ds.length) return null;
  let min=null;
  ds.forEach(d=>{
    const p=APP.products.find(x=>x.id===d.productId);
    if(!p) return;
    const r=p.stock-(need[d.productId]||0);
    if(min===null || r<min) min=r;
  });
  return min;
}
function addToCart(p){
  if(!p) return false;
  if(stockDisponible(p.id) <= 0){ bigAlert("NO HAY STOCK"); return false; }
  const key="p:"+p.id;
  const line=APP.cart.find(l=>l.key===key);
  if(line){ line.cant++; } else { APP.cart.push({key,tipo:"producto",refId:p.id,codigo:p.codigo,desc:p.descripcion,precioUnit:p.precio,costoUnit:p.costoProm,cant:1,maxStock:p.stock,paso:1,descuentos:[{productId:p.id,cant:1}]}); }
  renderCart();
  return true;
}
function addComboToCart(c){
  if(!c) return false;
  const key="c:"+c.id;
  let line=APP.cart.find(l=>l.key===key);
  if(c.tipo==="fijo"){
    const falta=(c.items||[]).some(it=>stockDisponible(it.productId) < it.cant);
    if(falta){ bigAlert("NO HAY STOCK"); return false; }
    if(line){ line.cant++; }
    else APP.cart.push({key,tipo:"comboFijo",refId:c.id,codigo:"COMBO",desc:c.nombre,precioUnit:c.precio,costoUnit:comboCosto(c),cant:1,paso:1,descuentos:(c.items||[]).map(it=>({productId:it.productId,cant:it.cant}))});
  } else {
    const p=APP.products.find(x=>x.id===c.productId);
    if(!p){toast("El producto de la promo ya no existe","bad");return false;}
    if(stockDisponible(p.id) < c.n){ bigAlert("NO HAY STOCK"); return false; }
    const eff=p.precio*(c.m/c.n);
    if(line){ line.cant+=c.n; }
    else APP.cart.push({key,tipo:"comboNxM",refId:c.id,codigo:"PROMO",desc:`${c.nombre} · ${c.n}x${c.m}`,precioUnit:eff,costoUnit:p.costoProm,cant:c.n,paso:c.n,descuentos:[{productId:p.id,cant:1}]});
  }
  renderCart();
  return true;
}
function renderCart(){
  const lines=$("cartLines"); if(!lines) return;
  if(APP.tickets && APP.tickets[APP.activeTicket]) APP.tickets[APP.activeTicket].cart=APP.cart;
  renderTicketTabs();
  if(!APP.cart.length){ lines.innerHTML=`<div class="empty"><div class="big">🛒</div>Escaneá un código de barras para empezar<div class="mini" style="margin-top:6px">o tocá <b>Productos</b> (F10) para buscar por nombre</div></div>`; }
  else{
    const NEED=cartNeed();
    lines.innerHTML=`<table class="cart-tbl"><thead><tr><th>Producto</th><th class="num">Cant.</th><th class="num">Costo unit.</th><th class="num">Importe</th><th class="num">Quedan</th><th></th></tr></thead><tbody>${
      APP.cart.map(l=>{
        const over = l.tipo==="producto" && l.maxStock!=null && l.cant>l.maxStock;
        const sel = POS.selectedLine===l.key ? " sel":"";
        const rest = lineRestante(l, NEED);

      const rm=e.target.closest("[data-rm]"); if(rm){ const k=rm.getAttribute("data-rm"); if(POS.selectedLine===k)POS.selectedLine=null; APP.cart=APP.cart.filter(l=>l.key!==k); renderCart(); return; }

function switchTicket(i){
  if(i===APP.activeTicket || !APP.tickets[i]) return;

}
function addTicket(){

function closeTicket(i){
  if(!APP.tickets[i]) return;
  const n=(APP.tickets[i].cart||[]).reduce((a,l)=>a+l.cant,0);
  if(!confirm(n>0?("Ese ticket tiene "+n+" producto(s) cargados. ¿Cerrarlo y descartarlo?"):"¿Cerrar este ticket?")) return;
  APP.tickets[APP.activeTicket].cart=APP.cart;
  const activeId=APP.tickets[APP.activeTicket].id;
  APP.tickets.splice(i,1);
  if(!APP.tickets.length) APP.tickets.push({id:uid(),cart:[]});
  let idx=APP.tickets.findIndex(x=>x.id===activeId);
  if(idx<0) idx=Math.min(i,APP.tickets.length-1);
  APP.activeTicket=idx; APP.cart=APP.tickets[APP.activeTicket].cart;
  renderCart();
}

async function doConfirmSale(){
  const total=cartTotal();
  if(!APP.cart.length){toast("Carrito vacío","bad");return false;}
  // necesidad de stock agregada por producto
  const need={};
  APP.cart.forEach(l=>l.descuentos.forEach(d=>{ need[d.productId]=(need[d.productId]||0)+d.cant*l.cant; }));
  const short=[];
  for(const pid in need){ const p=APP.products.find(x=>x.id===pid); const have=p?p.stock:0; if(need[pid]>have) short.push(`• ${p?p.descripcion:pid} (necesita ${need[pid]}, hay ${have})`); }
  if(short.length){ if(!confirm("Estos productos quedarían en stock negativo:\n"+short.join("\n")+"\n\n¿Confirmar la venta igual?")) return false; }
  let pagos=[];
  if(POS.method==="mixto"){
    const m=POS.mixto||{}; const s=Object.values(m).reduce((a,b)=>a+(+b||0),0);
    if(Math.round(s)!==Math.round(total)){toast("El pago mixto no suma el total","bad");return false;}
    pagos=Object.entries(m).filter(([,v])=>+v>0).map(([metodo,monto])=>({metodo,monto:+monto}));
  } else if(POS.method==="credito"){
    if(!POS.creditoUser){ toast("Elegí a quién se le fía la venta","bad"); return false; }
    pagos=[{metodo:"credito",monto:total}];
  } else {
    pagos=[{metodo:POS.method,monto:total}];
  }
  const cliente = "";
  const creditoUser = POS.method==="credito"?POS.creditoUser:null;

  const items=APP.cart.map(l=>({tipo:l.tipo,refId:l.refId,codigo:l.codigo,desc:l.desc,cant:l.cant,precioUnit:l.precioUnit,costoUnit:l.costoUnit}));
  const costoTotal=items.reduce((a,it)=>a+it.costoUnit*it.cant,0);
  const stockMov=Object.entries(need).map(([productId,cant])=>({productId,cant}));
  const sale={id:uid(),fecha:new Date().toISOString(),items,total,costoTotal,metodoPago:POS.method,pagos,cliente,creditoUser,usuario:APP.user.id,turnoId:APP.openShift.id,stockMov,anulada:false};
  await DB.put("sales",sale);
  for(const mv of stockMov){ const p=await DB.get("products",mv.productId); if(p){
    if(p.concesion && (+p.costoConcesion||0)>0){ await DB.put("concesiones",{id:uid(),productId:p.id,desc:p.descripcion,proveedor:p.provConcesion||"",cant:mv.cant,costoUnit:+p.costoConcesion||0,monto:Math.round((+p.costoConcesion||0)*mv.cant*100)/100,fecha:sale.fecha,saleId:sale.id,pagada:false,metodoPago:null,paidFecha:null,caja:null,usuario:APP.user.id}); }
    p.stock-=mv.cant; await DB.put("products",p);
  } }
  await refreshState();
  printTicket(sale);
  if(APP.tickets && APP.tickets.length>1){
    APP.tickets.splice(APP.activeTicket,1);
    if(APP.activeTicket>=APP.tickets.length) APP.activeTicket=APP.tickets.length-1;
    APP.cart=APP.tickets[APP.activeTicket].cart;
  } else {
    APP.cart=[]; if(APP.tickets&&APP.tickets[0]) APP.tickets[0].cart=APP.cart; APP.activeTicket=0;
  }
  POS.method="efectivo"; POS.mixto=null; POS.cliente=""; POS.creditoUser=null;
  toast("Venta registrada · "+money(total),"ok");
  scheduleBackup();
  renderCart();
  const s=$("posSearch"); if(s){s.value="";s.focus(); renderPosResults("");}
  return true;
}

async function fileToRows(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".csv")){
    return parseCSV(await file.text());
  }
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
}
function num(x){
  if(typeof x==="number") return isFinite(x)?x:0;
  let s=String(x==null?"":x).trim(); if(!s) return 0;
  s=s.replace(/[^0-9.,-]/g,"").replace(/\./g,"").replace(",",".");
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function downloadXLSX(filename,sheetName,rows){
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,sheetName||"Hoja1");
  XLSX.writeFile(wb,filename);
  toast("Excel exportado","ok");
}

function parseFechaFlex(x){
  if(x==null||x==="") return null;
  if(x instanceof Date) return isNaN(x)?null:new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()));
  if(typeof x==="number" && isFinite(x)) return new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000);
  const s=String(x).trim(); if(!s) return null;
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; return new Date(Date.UTC(+y,+m[2]-1,+m[1])); }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){ return new Date(Date.UTC(+m[1],+m[2]-1,+m[3])); }
  const d=new Date(s); return isNaN(d)?null:new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
}
function fISO(x){ const d=parseFechaFlex(x); if(!d) return null; return d.toISOString().slice(0,10)+"T12:00:00.000Z"; }
function fYMD(x){ const d=parseFechaFlex(x); if(!d) return null; return d.toISOString().slice(0,10); }

function parseCSV(text){
  const sep=text.indexOf(";")>-1 && text.indexOf(";")<text.indexOf(",")?";":(text.split("\n")[0].includes(";")?";":",");
  return text.replace(/\r/g,"").split("\n").map(line=>{
    const out=[];let cur="",q=false;
    for(let i=0;i<line.length;i++){const ch=line[i];
      if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(ch===sep&&!q){out.push(cur);cur="";}
      else cur+=ch;}
    out.push(cur);return out;});
}

async function viewVentas(v){
  const today=todayStr();
  const soloCajero = APP.user.rol==="cajero";
  v.innerHTML=`
    ${soloCajero?`<div class="help">Mostrando los movimientos de las <b>últimas 24 horas</b>.</div>`:`<div class="toolbar">
      <div class="field" style="margin:0"><label>Desde</label><input type="date" id="vDesde" value="${today}"></div>
      <div class="field" style="margin:0"><label>Hasta</label><input type="date" id="vHasta" value="${today}"></div>
      <div class="field" style="margin:0"><label>&nbsp;</label><button class="btn" id="vGo">Ver</button></div>
    </div>`}
    <div class="card"><div class="card-b flush"><div class="tbl-wrap"><table>
      <thead><tr><th>Fecha y hora</th><th>Usuario</th><th class="num">Ítems</th><th class="num">Total</th><th>Pago</th><th>Estado</th><th></th></tr></thead>
      <tbody id="vBody"></tbody></table></div></div></div>`;
  async function run(){
    let sales;
    if(soloCajero){
      const since=new Date(Date.now()-24*3600000).toISOString();
      sales=(await DB.all("sales")).filter(s=>s.fecha>=since).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    } else {
      const d1=$("vDesde").value,d2=$("vHasta").value;
      sales=(await DB.all("sales")).filter(s=>s.fecha.slice(0,10)>=d1&&s.fecha.slice(0,10)<=d2).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    }
    $("vBody").innerHTML=sales.map(s=>`<tr style="${s.anulada?'opacity:.55':''}">
      <td>${fmtDateTime(s.fecha)}</td><td>${esc(userName(s.usuario))}</td><td class="num">${s.items.length}</td>
      <td class="num">${money(s.total)}</td><td class="mini">${PAY_LABEL[s.metodoPago]||s.metodoPago}</td>
      <td>${s.anulada?'<span class="badge bad">anulada</span>':'<span class="badge ok">ok</span>'}</td>
      <td class="right"><button class="btn sm gray" data-v="${s.id}">Ver</button></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">Sin ventas en el rango.</div></td></tr>`;
    $("vBody").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>ventaDetalle(sales.find(s=>s.id===b.dataset.v)));
  }
  if($("vGo")) $("vGo").onclick=run;
  await run();
}
function ventaDetalle(s){
  const margen=s.total-(s.costoTotal||0);
  modal("Venta · "+fmtDateTime(s.fecha),`
    <div class="mini" style="margin-bottom:8px">Atendió: <b>${esc(userName(s.usuario))}</b>${s.cliente?` · Fiado a <b>${esc(s.cliente)}</b>`:""}</div>
    <table><thead><tr><th>Cant.</th><th>Detalle</th><th class="num">Subtotal</th></tr></thead><tbody>
    ${s.items.map(it=>`<tr><td>${it.cant}</td><td>${it.tipo&&it.tipo!=="producto"?(it.tipo==="comboFijo"?"🎁 ":"🏷️ "):""}${esc(it.desc)}</td><td class="num">${money(it.precioUnit*it.cant)}</td></tr>`).join("")}
    </tbody></table>
    <div class="cart-total"><span class="t">TOTAL</span><span class="v" style="font-size:22px">${money(s.total)}</span></div>
    <div class="mini">${(s.pagos||[]).map(p=>`${PAY_LABEL[p.metodo]}: ${money(p.monto)}`).join(" · ")}${APP.user.rol!=="cajero"?` · Margen ${money(margen)}`:""}</div>
    ${s.anulada?`<div class="help" style="margin-top:10px;background:#fde7e6;border-color:#f5c2c0;color:#a12b27"><b>Anulada</b> por ${esc(userName(s.anuladaPor))} el ${fmtDateTime(s.anuladaFecha)}.<br>Motivo: ${esc(s.motivoAnulacion||"—")}</div>`:""}
  `, s.anulada ? [{label:"Cerrar",cls:"btn gray",fn:c=>c()},{label:"Reimprimir ticket",cls:"btn gh",fn:c=>{printTicket(s);window.print();}}] : [
    {label:"Reimprimir ticket",cls:"btn gh",fn:c=>{printTicket(s);window.print();}},
    {label:"Anular venta",cls:"btn danger",fn:close=>anularVenta(s,close)}
  ]);
}
function anularVenta(sale,closeDetail){
  modal("Anular venta",`
    <div class="help">Anular <b>repone el stock</b> vendido y deja la venta marcada como anulada. No se borra: queda registrada en auditoría con tu usuario, fecha y motivo.</div>
    <div class="field"><label>Motivo de la anulación</label><input id="an_motivo" placeholder="Ej: error de carga, devolución…"></div>
  `,[{label:"Confirmar anulación",cls:"btn danger",fn:async close=>{
    const motivo=$("an_motivo").value.trim(); if(!motivo){toast("Indicá el motivo","bad");return;}
    const mov = sale.stockMov || sale.items.filter(it=>it.productId).map(it=>({productId:it.productId,cant:it.cant}));
    for(const mv of mov){ const p=await DB.get("products",mv.productId); if(p){p.stock+=mv.cant; await DB.put("products",p);} }
    sale.anulada=true; sale.anuladaPor=APP.user.id; sale.anuladaFecha=new Date().toISOString(); sale.motivoAnulacion=motivo;
    await DB.put("sales",sale);
    await refreshState(); close(); if(closeDetail) closeDetail(); toast("Venta anulada · stock repuesto","ok"); go("ventas");
  }}]);
}

async function viewCompras(v){
  const purchases=(await DB.all("purchases")).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const suppliers=await DB.all("suppliers");
  const SEL=new Set(); let visibles=[];
  const provs=[...new Set(purchases.map(c=>c.proveedorNombre||c.proveedor||"").filter(Boolean))].sort();
  const meses=[...new Set(purchases.map(c=>(c.fecha||"").slice(0,7)).filter(Boolean))].sort().reverse();
  v.innerHTML=`
    <div class="help">Historial completo de compras. Filtrá por proveedor y por mes; las tarjetas de arriba se ajustan al filtro. Cada fila es editable.</div>
    <div class="grid kpis">
      <div class="kpi"><div class="lab">Total comprado</div><div class="val" id="kTotal">$0</div></div>
      <div class="kpi cel"><div class="lab">Contado</div><div class="val" id="kContado">$0</div></div>
      <div class="kpi warn"><div class="lab">Crédito</div><div class="val" id="kCredito">$0</div></div>
      <div class="kpi"><div class="lab">Nº de compras</div><div class="val" id="kCount">0</div></div>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <select id="fProv"><option value="">Todos los proveedores</option>${provs.map(p=>`<option>${esc(p)}</option>`).join("")}</select>
      <select id="fMes"><option value="">Todos los períodos</option>${meses.map(m=>`<option value="${m}">${mesLabel(m)}</option>`).join("")}</select>
      <button class="btn" id="newPurchase">+ Registrar compra</button>
      <button class="btn gh" id="impCompras">Importar Excel</button>
      <button class="btn gray" id="tplCompras">Plantilla Excel</button>
      <button class="btn gray" id="expCompras">Exportar Excel</button>
    </div>
    <div class="selbar">
      <div style="display:flex;align-items:center;gap:9px"><span class="selcirc" id="cSelAll"></span><span class="sellabel" id="cSelAllLbl">Seleccionar todo</span><span class="mini" id="cSelCount"></span></div>
      <div id="cSelActions" style="display:none;gap:8px"><button class="btn sm danger" id="cSelDel">🗑 Borrar seleccionadas</button><button class="btn sm gray" id="cSelClear">Cancelar</button></div>
    </div>
    <div class="card"><div class="card-b flush"><div class="tbl-wrap"><table><thead><tr><th class="selcol"></th><th>Fecha registro</th><th>Fecha ingreso</th><th>Proveedor</th><th class="num">Total</th><th>Pago</th><th>Usuario</th><th></th></tr></thead><tbody id="compBody"></tbody></table></div></div></div>`;
  function draw(){
    const prov=$("fProv").value, mes=$("fMes").value;
    let list=purchases;
    if(prov) list=list.filter(c=>(c.proveedorNombre||c.proveedor||"")===prov);
    if(mes) list=list.filter(c=>(c.fecha||"").slice(0,7)===mes);
    visibles=list;
    const tot=list.reduce((a,c)=>a+purchaseTotal(c),0);
    const cont=list.filter(c=>c.formaPago!=="credito").reduce((a,c)=>a+purchaseTotal(c),0);
    const cred=list.filter(c=>c.formaPago==="credito").reduce((a,c)=>a+purchaseTotal(c),0);
    $("kTotal").textContent=money(tot); $("kContado").textContent=money(cont); $("kCredito").textContent=money(cred); $("kCount").textContent=list.length;
    $("compBody").innerHTML=list.map(c=>{const on=SEL.has(c.id);return `<tr class="${on?'selrow':''}">
      <td class="selcol"><span class="selcirc ${on?'on':''}" data-sel="${c.id}"></span></td>
      <td class="mini">${c.fechaRegistro?fmtDateTime(c.fechaRegistro):"—"}</td>
      <td>${c.fecha?fmtDateTime(c.fecha):"—"}</td>
      <td>${esc(c.proveedorNombre||c.proveedor||"—")}</td>
      <td class="num">${money(purchaseTotal(c))}</td>
      <td>${c.formaPago==="credito"?(c.pagada?'<span class="badge ok">crédito · pagada</span>':'<span class="badge warn">crédito · a pagar</span>'):'<span class="badge cel">contado</span>'}</td>
      <td class="mini">${esc(userName(c.usuario))}</td>
      <td class="right"><button class="btn sm gray" data-editp="${c.id}">Editar</button></td></tr>`;}).join("")||`<tr><td colspan="8"><div class="empty">Sin compras para este filtro.</div></td></tr>`;
    $("compBody").querySelectorAll("[data-editp]").forEach(b=>b.onclick=()=>{ const c=purchases.find(x=>x.id===b.dataset.editp); if(c.items&&c.items.length>0) editPurchaseModal(c); else editPurchaseSimple(c,suppliers); });
    $("compBody").querySelectorAll("[data-sel]").forEach(s=>s.onclick=()=>{ const id=s.dataset.sel; if(SEL.has(id))SEL.delete(id);else SEL.add(id); draw(); });
    const n=SEL.size; $("cSelCount").textContent=n?`· ${n} seleccionada${n>1?"s":""}`:""; $("cSelActions").style.display=n?"flex":"none";
    $("cSelAll").classList.toggle("on", visibles.length>0 && visibles.every(c=>SEL.has(c.id)));
  }
  const toggleAll=()=>{ const all=visibles.length>0&&visibles.every(c=>SEL.has(c.id)); if(all)visibles.forEach(c=>SEL.delete(c.id));else visibles.forEach(c=>SEL.add(c.id)); draw(); };
  $("cSelAll").onclick=toggleAll; $("cSelAllLbl").onclick=toggleAll;
  $("cSelClear").onclick=()=>{ SEL.clear(); draw(); };
  $("cSelDel").onclick=async()=>{ const ids=[...SEL]; if(!ids.length)return; if(!confirm(`¿Seguro que querés borrar ${ids.length} compra${ids.length>1?"s":""}? Esta acción NO se puede deshacer.`))return; for(const id of ids) await trashDel("purchases",id); SEL.clear(); await refreshState(); toast(`${ids.length} compra${ids.length>1?"s":""} borrada${ids.length>1?"s":""}`,"ok"); go("compras"); };

  $("fProv").onchange=()=>{SEL.clear();draw();}; $("fMes").onchange=()=>{SEL.clear();draw();}; draw();
  $("newPurchase").onclick=()=>openPurchaseWindow(suppliers);

  $("tplCompras").onclick=downloadComprasTemplate;
  $("expCompras").onclick=()=>{

    purchases.forEach(c=>rows.push([(c.fecha||"").slice(0,10),c.proveedorNombre||c.proveedor||"",purchaseTotal(c),c.formaPago==="credito"?"Credito":"Contado",c.diasCredito||"",(c.vencimiento||"").slice(0,10),c.pagada?"Si":"No",userName(c.usuario)]));
    downloadXLSX("compras-"+todayStr()+".xlsx","Compras",rows);
  };
}
function editPurchaseSimple(c, suppliers){

    </div>
    <div class="row2">
      <div class="field"><label>Fecha de pago / vencimiento</label><input type="date" id="ep_venc" value="${vencVal}"></div>
      <div class="field"><label>¿Pagada?</label><select id="ep_pag"><option value="si" ${c.pagada?"selected":""}>Sí</option><option value="no" ${!c.pagada?"selected":""}>No</option></select></div>
    </div>
    <div class="mini">Fecha de registro: <b>${c.fechaRegistro?fmtDateTime(c.fechaRegistro):"—"}</b> (automática, no editable). Editás la fecha de ingreso y los datos generales.</div>
  `,[
    {label:"Eliminar",cls:"btn danger sm",fn:async close=>{ if(confirm("¿Eliminar esta compra del historial?")){ await trashDel("purchases",c.id); await refreshState(); close(); toast("Compra eliminada","ok"); go("compras"); } }},
    {label:"Guardar",cls:"btn",fn:async close=>{
      const monto=parseNum($("ep_monto").value);

      c.fecha=($("ep_f").value?$("ep_f").value+"T12:00:00.000Z":c.fecha);
      c.proveedorNombre=prov; c.proveedorId=provId;
      c.total=monto; c.subtotal=monto; c.iva=0; c.envio=0;
      c.formaPago=forma; c.vencimiento=($("ep_venc").value?$("ep_venc").value+"T12:00:00.000Z":null);
      c.pagada=($("ep_pag").value==="si"); c.caja = forma==="contado"?"fisica":null;

  ]);
}

  </style></head><body>
  <header><h1>Registrar compra / ingreso de stock</h1></header>

  <div class="bar"><button id="cancel">Cancelar</button><button id="confirm" disabled>Confirmar compra</button></div>
  <script>
    var PRODS=${prodJson}, SUPS=${supJson}, lines=[];
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
    function money(n){return "$"+Math.round(+n||0).toLocaleString("es-AR");}
    function num(s){var v=parseFloat(String(s).replace(",",".")); return isNaN(v)?0:v;}
    var prov=document.getElementById("prov");

    function addProd(id){

      lines.push({id:p.i,desc:p.d,stock:p.s,costoActual:p.cp,cant:1,costoUnit:p.cp,precio:p.pv,confirmed:false});

    }
    function ivaFac(){ var v=num(document.getElementById("iva").value); return 1+v/100; }
    function calcRow(l){
      var ce=(+l.costoUnit||0)*ivaFac();
      var ns=l.stock+(+l.cant||0);
      var cp = ns>0 ? (((l.stock*l.costoActual)+((+l.cant||0)*ce))/ns) : ce;

    function allConfirmed(){ return lines.length>0 && lines.every(function(l){return l.confirmed;}); }
    function draw(){
      var tb=document.getElementById("tb");

      else tb.innerHTML=lines.map(function(l,i){
        var r=calcRow(l); var dis=l.confirmed?"disabled":"";
        return '<tr class="'+(l.confirmed?"okrow":"")+'">'
          +'<td class="cc"><span class="circ '+(l.confirmed?"on":"")+'" data-tick="'+i+'" title="'+(l.confirmed?"Confirmado":"Tocá para confirmar")+'"></span></td>'
          +'<td><b>'+esc(l.desc)+'</b><div class="meta">stock '+l.stock+' \u00b7 costo actual '+money(l.costoActual)+'</div></td>'
          +'<td class="num"><div class="stp"><input data-c="'+i+'" value="'+l.cant+'" '+dis+'><div class="arr"><button data-up="'+i+'" '+dis+'>&#9650;</button><button data-dn="'+i+'" '+dis+'>&#9660;</button></div></div></td>'
          +'<td class="num"><input class="w" data-u="'+i+'" value="'+l.costoUnit+'" '+dis+'></td>'
          +'<td class="num" style="font-weight:800" data-imp="'+i+'">'+money((+l.costoUnit||0)*(+l.cant||0)*ivaFac())+'</td>'
          +'<td class="num" style="font-weight:700" data-cp="'+i+'">'+money(r.cp)+'</td>'
          +'<td class="num"><span class="pv" data-pv="'+i+'" title="Doble clic para editar">'+money(l.precio)+'</span></td>'
          +'<td class="num"><span class="mk '+(r.mk<0?"bad":r.mk<50?"warn":"ok")+'" data-mk="'+i+'">'+r.mk.toFixed(1)+'%</span></td>'
          +'<td class="num">'+(l.confirmed?"":'<button class="rm" data-x="'+i+'">&times;</button>')+'</td></tr>';
      }).join("");
      function patchRow(i){ var l=lines[i]; if(!l)return; var rr=calcRow(l); var imp=tb.querySelector('[data-imp="'+i+'"]'); if(imp)imp.textContent=money((+l.costoUnit||0)*(+l.cant||0)*ivaFac()); var cp=tb.querySelector('[data-cp="'+i+'"]'); if(cp)cp.textContent=money(rr.cp); var mk=tb.querySelector('[data-mk="'+i+'"]'); if(mk){mk.textContent=rr.mk.toFixed(1)+'%'; mk.className='mk '+(rr.mk<0?"bad":rr.mk<50?"warn":"ok");} updTotal(); updConfirm(); }
      function numInput(inp,attr,set){ inp.oninput=function(){ var raw=inp.value,p=inp.selectionStart; var nv=raw.replace(/[^0-9.,]/g,""); if(nv!==raw){ inp.value=nv; var np=Math.max(0,p-(raw.length-nv.length)); try{inp.setSelectionRange(np,np);}catch(e){} } set(+inp.getAttribute(attr),num(inp.value)); patchRow(+inp.getAttribute(attr)); }; inp.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } }; }
      Array.prototype.forEach.call(tb.querySelectorAll("[data-c]"),function(inp){ numInput(inp,"data-c",function(i,val){lines[i].cant=val;}); });
      Array.prototype.forEach.call(tb.querySelectorAll("[data-u]"),function(inp){ numInput(inp,"data-u",function(i,val){lines[i].costoUnit=val;}); });
      Array.prototype.forEach.call(tb.querySelectorAll("[data-up]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-up");lines[i].cant=(+lines[i].cant||0)+1;draw();};});
      Array.prototype.forEach.call(tb.querySelectorAll("[data-dn]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-dn");lines[i].cant=Math.max(1,(+lines[i].cant||0)-1);draw();};});
      Array.prototype.forEach.call(tb.querySelectorAll("[data-x]"),function(b){b.onclick=function(){lines.splice(+b.getAttribute("data-x"),1);draw();};});
      Array.prototype.forEach.call(tb.querySelectorAll("[data-tick]"),function(c){c.onclick=function(){var i=+c.getAttribute("data-tick");lines[i].confirmed=!lines[i].confirmed;draw();};});
      Array.prototype.forEach.call(tb.querySelectorAll("[data-pv]"),function(sp){sp.ondblclick=function(){editPv(sp,+sp.getAttribute("data-pv"));};});
      var lock=!allConfirmed();
      document.getElementById("iva").disabled=lock;
      document.getElementById("envio").disabled=lock;
      document.getElementById("hint").style.display=lock?"block":"none";
      updTotal(); updConfirm();
    }
    function editPv(sp,i){
      var inp=document.createElement("input"); inp.className="w"; inp.value=lines[i].precio;
      sp.parentNode.replaceChild(inp,sp); inp.focus(); inp.select();
      function commit(){ var v=num(inp.value); if(v>0) lines[i].precio=v; draw(); }
      inp.onblur=commit; inp.onkeydown=function(e){ if(e.key==="Enter") inp.blur(); };
    }
    function updTotal(){

    }
    function updConfirm(){
      var iva=num(document.getElementById("iva").value);
      document.getElementById("confirm").disabled=!(document.getElementById("prov").value && lines.length && allConfirmed());
    }
    document.getElementById("iva").oninput=function(){ var v=this.value.replace(/[^0-9.,]/g,""); if(num(v)>100) v="100"; this.value=v; draw(); };
    document.getElementById("envio").oninput=function(){ this.value=this.value.replace(/[^0-9.,]/g,""); updTotal(); };
    document.getElementById("prov").onchange=updConfirm;
    var forma=document.getElementById("forma");
    forma.onchange=function(){ document.getElementById("diasWrap").style.display=forma.value==="credito"?"block":"none"; };
    document.getElementById("cancel").onclick=function(){ window.close(); };
    document.getElementById("confirm").onclick=function(){
      var iva=num(document.getElementById("iva").value);

      if(iva<0 || iva>100){ alert("El IVA es un porcentaje: tiene que estar entre 0 y 100."); return; }
      var pv=document.getElementById("prov");
      var data={proveedorId:pv.value, proveedorNombre:pv.options[pv.selectedIndex].text,

        fecha:document.getElementById("fingreso").value, iva:iva, envio:num(document.getElementById("envio").value), forma:forma.value, dias:num(document.getElementById("dias").value), concesion:document.getElementById("esConcesion").checked};
      if(window.opener && !window.opener.closed){ window.opener.postMessage({__purchase:true, data:data}, "*"); alert("Compra registrada. Se actualizaron stock, costos y precios."); window.close(); }
      else { alert("La ventana principal se cerró. Volvé a abrir la compra."); }
    };
    draw();
  <\/script></body></html>`;
  w.document.open(); w.document.write(html); w.document.close();
}
async function applyPurchase(d){
  if(!d || !d.lines || !d.lines.length) return;
  const iva=+d.iva||0, envio=+d.envio||0, fac=1+iva/100;
  const concesion=!!d.concesion, provNom=(d.proveedorNombre||"");
  for(const ln of d.lines){
    const p=await DB.get("products",ln.id); if(!p) continue;
    const ce=(+ln.costoUnit||0)*fac;
    const ns=p.stock+(+ln.cant||0);
    const costoAnt=p.costoProm;
    p.costoProm = ns>0 ? Math.round((((p.stock*p.costoProm)+((+ln.cant||0)*ce))/ns)*100)/100 : Math.round(ce*100)/100;
    p.stock=ns;
    if(ln.precio!=null && +ln.precio>0 && +ln.precio!==p.precio) p.precio=+ln.precio;
    if(concesion){ p.concesion=true; p.costoConcesion=Math.round(ce*100)/100; p.provConcesion=provNom; }
    await DB.put("products",p);
    if(Math.abs(costoAnt-p.costoProm)>0.001) await DB.put("priceHistory",{id:uid(),productId:p.id,fecha:new Date().toISOString(),campo:"costo",anterior:costoAnt,nuevo:p.costoProm,usuario:APP.user.id,nota:"compra"});
  }
  const prov = d.proveedorId ? (await DB.all("suppliers")).find(s=>s.id===d.proveedorId) : null;
  const subtotal=d.lines.reduce((a,l)=>a+(+l.cant||0)*(+l.costoUnit||0),0);
  const total=Math.round((subtotal*fac+envio)*100)/100;
  const dias=d.forma==="credito"?(parseInt(d.dias)||0):0;
  const venc=(d.forma==="credito"&&dias>0)?new Date(Date.now()+dias*86400000).toISOString():null;
  await DB.put("purchases",{id:uid(),fecha:(d.fecha?d.fecha+"T12:00:00.000Z":new Date().toISOString()),fechaRegistro:new Date().toISOString(),proveedorId:d.proveedorId||null,proveedorNombre:prov?prov.nombre:(d.proveedorNombre||""),
    items:d.lines.map(l=>({productId:l.id,cant:+l.cant||0,costoUnit:+l.costoUnit||0})),
    iva,envio,subtotal,total,formaPago:(concesion?"concesion":d.forma),concesion,diasCredito:dias,vencimiento:venc,
    caja:(concesion?null:(d.forma==="contado"?"fisica":null)),pagada:(concesion?false:(d.forma==="contado")),paidTurnoId:null,paidCaja:null,paidFecha:null,
    turnoId:(APP.openShift?APP.openShift.id:null),usuario:APP.user.id});
  await refreshState();
  toast(concesion?"Compra a concesión guardada · el stock ya está disponible":(d.forma==="credito"?"Compra a crédito guardada (Cuentas por pagar)":"Compra registrada · costos y precios actualizados"),"ok");
  if(APP.page==="compras") go("compras");
}
async function editPurchaseModal(p){
  if(!p) return;
  const suppliers=(await DB.all("suppliers")).filter(s=>s.activo!==false).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const provOpts=`<option value="">— Elegí un proveedor —</option>`+suppliers.map(s=>`<option value="${s.id}" ${p.proveedorId===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("");
  let lines=(p.items||[]).map(it=>{ const pr=APP.products.find(x=>x.id===it.productId); return {id:it.productId, desc:pr?pr.descripcion:"(producto eliminado)", cant:it.cant, costoUnit:it.costoUnit, exists:!!pr}; });
  modal("Editar compra",`
    <div class="help">Corregí lo que necesites. Al guardar, el <b>stock se ajusta por la diferencia</b> de cantidades. (El costo promedio histórico no se recalcula hacia atrás.)</div>
    <div class="field"><label>Proveedor</label><select id="ep_prov">${provOpts}</select></div>
    <div id="ep_lines"></div>
    <div class="row2" style="margin-top:6px">
      <div class="field"><label>IVA de la boleta (%)</label><input id="ep_iva" inputmode="decimal" value="${p.iva||0}"></div>
      <div class="field"><label>Costo de envío ($)</label><input id="ep_envio" inputmode="decimal" value="${p.envio||0}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Forma de pago</label><select id="ep_forma"><option value="contado" ${p.formaPago!=="credito"?"selected":""}>Contado</option><option value="credito" ${p.formaPago==="credito"?"selected":""}>Crédito (a pagar)</option></select></div>
      <div class="field" id="ep_extra"></div>
    </div>
    <div class="card"><div class="card-b" id="ep_total"></div></div>
  `,[{label:"Guardar cambios",cls:"btn",fn:async close=>{
    const provId=$("ep_prov").value; if(!provId){toast("Elegí un proveedor","bad");return;}
    const active=lines.filter(l=>(+l.cant||0)>0);
    if(!active.length){toast("Debe quedar al menos un producto","bad");return;}
    // ajustar stock por diferencia (original vs nuevo)
    const origMap={}; (p.items||[]).forEach(it=>{origMap[it.productId]=(origMap[it.productId]||0)+(+it.cant||0);});
    const newMap={}; active.forEach(l=>{newMap[l.id]=(newMap[l.id]||0)+(+l.cant||0);});
    const ids=new Set([...Object.keys(origMap),...Object.keys(newMap)]);
    for(const id of ids){ const delta=(newMap[id]||0)-(origMap[id]||0); if(delta!==0){ const pr=await DB.get("products",id); if(pr){ pr.stock+=delta; await DB.put("products",pr); } } }
    const iva=parseNum($("ep_iva").value), envio=parseNum($("ep_envio").value), forma=$("ep_forma").value;
    const dias= forma==="credito"?(parseInt($("ep_dias").value)||0):0;
    const caja= forma==="contado"?"fisica":null;
    const prov=suppliers.find(s=>s.id===provId);
    const subtotal=active.reduce((a,l)=>a+l.cant*(+l.costoUnit||0),0);
    const total=Math.round((subtotal*(1+iva/100)+envio)*100)/100;
    const venc=(forma==="credito"&&dias>0)?new Date(Date.now()+dias*86400000).toISOString():null;
    p.proveedorId=provId; p.proveedorNombre=prov?prov.nombre:"";
    p.items=active.map(l=>({productId:l.id,cant:l.cant,costoUnit:l.costoUnit}));
    p.iva=iva; p.envio=envio; p.subtotal=subtotal; p.total=total; p.formaPago=forma; p.diasCredito=dias; p.vencimiento=venc;
    if(forma==="contado"){ p.caja=caja; p.pagada=true; } else { p.caja=null; if(p.pagada!==true) p.pagada=false; }
    p.editadoPor=APP.user.id; p.editadoFecha=new Date().toISOString();
    await DB.put("purchases",p);
    await refreshState(); close(); toast("Compra actualizada · stock ajustado","ok"); go("compras");
  }}],"wide");
  function renderForma(){ const f=$("ep_forma").value; $("ep_extra").innerHTML = f==="credito" ? `<label>Días para pagar</label><input id="ep_dias" inputmode="numeric" value="${p.diasCredito||30}">` : `<label>&nbsp;</label><div class="mini" style="padding-top:9px">Pago en efectivo (caja)</div>`; }
  function totalResume(){ const iva=parseNum($("ep_iva").value), envio=parseNum($("ep_envio").value); const subtotal=lines.reduce((a,l)=>a+(+l.cant||0)*(+l.costoUnit||0),0); const total=subtotal*(1+iva/100)+envio; $("ep_total").innerHTML=`<div class="row3" style="text-align:center"><div><div class="lab mini">Mercadería</div><div style="font-size:18px;font-weight:800">${money(subtotal)}</div></div><div><div class="lab mini">+ IVA ${iva.toFixed(0)}% + envío</div><div style="font-size:18px;font-weight:800">${money(subtotal*iva/100+envio)}</div></div><div><div class="lab mini">Total a pagar</div><div style="font-size:20px;font-weight:800;color:var(--orange)">${money(total)}</div></div></div>`; }
  function drawLines(){
    $("ep_lines").innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Costo ingreso</th><th></th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td><b>${esc(l.desc)}</b>${l.exists?"":' <span class="badge bad">eliminado</span>'}</td><td class="num"><input data-c="${i}" value="${l.cant}" inputmode="decimal" style="width:70px;text-align:right;padding:6px;border:1px solid var(--line);border-radius:6px"></td><td class="num"><input data-u="${i}" value="${l.costoUnit}" inputmode="decimal" style="width:96px;text-align:right;padding:6px;border:1px solid var(--line);border-radius:6px"></td><td class="right"><button class="rm" data-x="${i}">×</button></td></tr>`).join("")}</tbody></table></div>`;
    $("ep_lines").querySelectorAll("[data-c]").forEach(inp=>inp.oninput=()=>{ inp.value=inp.value.replace(/[^0-9.,]/g,""); lines[+inp.dataset.c].cant=parseNum(inp.value); totalResume(); });
    $("ep_lines").querySelectorAll("[data-u]").forEach(inp=>inp.oninput=()=>{ inp.value=inp.value.replace(/[^0-9.,]/g,""); lines[+inp.dataset.u].costoUnit=parseNum(inp.value); totalResume(); });
    $("ep_lines").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ lines.splice(+b.dataset.x,1); drawLines(); totalResume(); });
  }
  $("ep_iva").oninput=totalResume; $("ep_envio").oninput=totalResume; $("ep_forma").onchange=renderForma;
  renderForma(); drawLines(); totalResume();
}
function parseNum(v){ v=String(v==null?"":v).replace(/[^0-9.,]/g,"").replace(/\./g,"").replace(",","."); const n=parseFloat(v); return isNaN(n)?0:n; }

function mLabel(m){ const p=(m||"").split("-"); const N=["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return (N[+p[1]]||"")+" "+(p[0]||"").slice(2); }
function monthsBetween(m1,m2){ const out=[]; let a=m1.split("-").map(Number), b=m2.split("-").map(Number); let y=a[0],mo=a[1]; while(y<b[0]||(y===b[0]&&mo<=b[1])){ out.push(y+"-"+String(mo).padStart(2,"0")); mo++; if(mo>12){mo=1;y++;} if(out.length>60)break; } return out; }
function svgLineChart(labels, series){
  const W=680,H=250,pad={l:60,r:14,t:12,b:34}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  let max=Math.max(1,...series.flatMap(s=>s.data));
  const p=Math.pow(10,Math.floor(Math.log10(max)))||1, n=max/p; const step=n<=1?1:n<=2?2:n<=5?5:10; max=step*p;
  const N=labels.length, X=i=>pad.l+(N<=1?iw/2:iw*i/(N-1)), Y=val=>pad.t+ih-(val/max*ih);
  const grid=[0,.25,.5,.75,1].map(f=>{const gy=pad.t+ih-f*ih;return `<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="#eee"/><text x="${pad.l-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="#999">${money(Math.round(max*f))}</text>`;}).join("");
  const xl=labels.map((l,i)=>`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#999">${esc(l)}</text>`).join("");
  const paths=series.map(s=>{const pts=s.data.map((v,i)=>X(i)+","+Y(v)).join(" ");const dots=s.data.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.color}"/>`).join("");return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5"/>${dots}`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${paths}${xl}</svg>`;
}
async function gastosAnalysis(defFrom,defTo){
  const expenses=await DB.all("expenses");
  const now=todayStr().slice(0,7);
  const toM=defTo?defTo.slice(0,7):now;
  let fromM; if(defFrom) fromM=defFrom.slice(0,7); else { const d=new Date(); d.setMonth(d.getMonth()-5); fromM=d.toISOString().slice(0,7); }
  const catOpts=`<option value="">Todas las categorías</option>`+GASTO_CATS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  modal("Análisis de gastos fijos y variables",`
    <div class="toolbar" style="margin-bottom:4px">
      <div class="field" style="margin:0"><label>Desde (mes)</label><input type="month" id="ga_desde" value="${fromM}"></div>
      <div class="field" style="margin:0"><label>Hasta (mes)</label><input type="month" id="ga_hasta" value="${toM}"></div>
      <div class="field" style="margin:0"><label>Categoría</label><select id="ga_cat">${catOpts}</select></div>
    </div>
    <div id="ga_out"></div>
  `,[{label:"Cerrar",cls:"btn gray",fn:close=>close()}],"wide");
  function render(){
    const m1=$("ga_desde").value, m2=$("ga_hasta").value, catF=$("ga_cat").value;
    if(!m1||!m2||m1>m2){ $("ga_out").innerHTML=`<div class="empty">Elegí un rango de meses válido.</div>`; return; }
    const months=monthsBetween(m1,m2);
    const inRange=expenses.filter(e=>{const mm=(e.fecha||"").slice(0,7);return mm>=m1&&mm<=m2&&(!catF||e.categoria===catF);});
    let tF=0,tV=0; inRange.forEach(e=> e.tipo==="variable"?tV+=e.monto:tF+=e.monto);
    const mF={},mV={}; months.forEach(m=>{mF[m]=0;mV[m]=0;});
    inRange.forEach(e=>{const m=e.fecha.slice(0,7); if(mF[m]==null)return; e.tipo==="variable"?mV[m]+=e.monto:mF[m]+=e.monto;});
    const fixedCats=[...new Set(inRange.filter(e=>e.tipo!=="variable").map(e=>e.categoria))].sort();
    const matrix={}; fixedCats.forEach(c=>{matrix[c]={}; months.forEach(m=>matrix[c][m]=0);});
    inRange.filter(e=>e.tipo!=="variable").forEach(e=>{matrix[e.categoria][e.fecha.slice(0,7)]+=e.monto;});
    const chart=svgLineChart(months.map(mLabel),[
      {name:"Fijos",color:"#E04612",data:months.map(m=>Math.round(mF[m]))},
      {name:"Variables",color:"#4A90C2",data:months.map(m=>Math.round(mV[m]))}
    ]);
    const matHeader=`<th>Categoría (fijo)</th>${months.map(m=>`<th class="num">${mLabel(m)}</th>`).join("")}<th class="num">Total</th>`;
    const matRows=fixedCats.map(c=>{
      const cells=months.map(m=>{const val=matrix[c][m];return val>0?`<td class="num">${money(val)}</td>`:`<td class="num" style="background:#fdecec;color:#c0392b;font-size:11px">falta</td>`;}).join("");
      const tot=months.reduce((a,m)=>a+matrix[c][m],0);
      return `<tr><td><b>${esc(c)}</b></td>${cells}<td class="num"><b>${money(tot)}</b></td></tr>`;
    }).join("")||`<tr><td colspan="${months.length+2}"><div class="empty">No hay gastos fijos en el rango.</div></td></tr>`;
    const grupos={}; inRange.forEach(e=>{const g=grupoGasto(e.categoria);grupos[g]=(grupos[g]||0)+e.monto;});
    $("ga_out").innerHTML=`
      <div class="grid kpis">
        <div class="kpi ok"><div class="lab">Fijos (período)</div><div class="val">${money(tF)}</div></div>
        <div class="kpi warn"><div class="lab">Variables (período)</div><div class="val">${money(tV)}</div></div>
        <div class="kpi"><div class="lab">Total</div><div class="val">${money(tF+tV)}</div></div>
      </div>
      <div class="card" style="margin-top:14px"><div class="card-h"><h3>Evolución mensual</h3><span class="mini"><span style="color:#E04612">●</span> Fijos &nbsp; <span style="color:#4A90C2">●</span> Variables</span></div><div class="card-b">${chart}</div></div>
      <div class="card" style="margin-top:14px"><div class="card-h"><h3>Gastos fijos mes a mes</h3><span class="mini">Rojo = ese mes no cargaste ese gasto fijo</span></div><div class="card-b flush"><div class="tbl-wrap"><table><thead><tr>${matHeader}</tr></thead><tbody>${matRows}</tbody></table></div></div></div>
      <div class="card" style="margin-top:14px"><div class="card-h"><h3>Por grupo</h3></div><div class="card-b flush"><table><tbody>
        ${Object.entries(grupos).sort((a,b)=>b[1]-a[1]).map(([g,m])=>`<tr><td>${esc(g)}</td><td class="num">${money(m)}</td></tr>`).join("")||`<tr><td><div class="empty">Sin datos.</div></td></tr>`}
      </tbody></table></div></div>`;
  }
  $("ga_desde").onchange=render; $("ga_hasta").onchange=render; $("ga_cat").onchange=render;
  render();
}
async function viewGastos(v){
  const exp=(await DB.all("expenses")).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const cats=GASTO_CATS;
  const meses=[...new Set(exp.map(e=>(e.fecha||"").slice(0,7)).filter(Boolean))].sort().reverse();

    <div class="grid kpis">
      <div class="kpi"><div class="lab">Total gastos</div><div class="val" id="gkTotal">$0</div></div>
      <div class="kpi ok"><div class="lab">Fijos</div><div class="val" id="gkFijos">$0</div></div>
      <div class="kpi warn"><div class="lab">Variables</div><div class="val" id="gkVar">$0</div></div>
      <div class="kpi"><div class="lab">Nº de gastos</div><div class="val" id="gkCount">0</div></div>
    </div>
    <div class="toolbar" style="margin-top:16px">
