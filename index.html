    <div class="selbar">
      <div style="display:flex;align-items:center;gap:9px"><span class="selcirc" id="gSelAll"></span><span class="sellabel" id="gSelAllLbl">Seleccionar todo</span><span class="mini" id="gSelCount"></span></div>
      <div id="gSelActions" style="display:none;gap:8px"><button class="btn sm danger" id="gSelDel">🗑 Borrar seleccionados</button><button class="btn sm gray" id="gSelClear">Cancelar</button></div>
    </div>
    <div class="card"><div class="card-b flush"><div class="tbl-wrap"><table><thead><tr><th class="selcol"></th><th>Fecha registro</th><th>Fecha ingreso</th><th>Categoría</th><th>Tipo</th><th>Descripción</th><th class="num">Monto</th><th>Usuario</th><th></th></tr></thead><tbody id="gastBody"></tbody></table></div></div></div>`;
  const GSEL=new Set();
  let gvis=exp;
  function gfilter(){ const c=$("gCat").value,t=$("gTipo").value,m=$("gMes").value; let L=exp; if(c)L=L.filter(e=>e.categoria===c); if(t)L=L.filter(e=>(e.tipo||"fijo")===t); if(m)L=L.filter(e=>(e.fecha||"").slice(0,7)===m); gvis=L; return L; }
  function gdraw(){
    const L=gfilter();
    const tot=L.reduce((a,e)=>a+(+e.monto||0),0), fij=L.filter(e=>(e.tipo||"fijo")!=="variable").reduce((a,e)=>a+(+e.monto||0),0);
    $("gkTotal").textContent=money(tot); $("gkFijos").textContent=money(fij); $("gkVar").textContent=money(tot-fij); $("gkCount").textContent=L.length;
    $("gastBody").innerHTML=L.map(e=>{const on=GSEL.has(e.id);return `<tr class="${on?'selrow':''}"><td class="selcol"><span class="selcirc ${on?'on':''}" data-sel="${e.id}"></span></td><td class="mini">${e.fechaRegistro?fmtDateTime(e.fechaRegistro):"—"}</td><td>${fmtDate(e.fecha)}</td><td><span class="badge cel">${esc(e.categoria)}</span></td><td>${e.tipo==="variable"?'<span class="badge warn">Variable</span>':'<span class="badge ok">Fijo</span>'}</td><td>${esc(e.descripcion)}</td><td class="num">${money(e.monto)}</td><td class="mini">${esc(userName(e.usuario))}</td><td class="right"><button class="btn sm gray" data-edx="${e.id}">Editar</button> <button class="rm" data-del="${e.id}">×</button></td></tr>`;}).join("")||`<tr><td colspan="9"><div class="empty">Sin gastos para este filtro.</div></td></tr>`;
    const n=GSEL.size; $("gSelCount").textContent=n?`· ${n} seleccionado${n>1?"s":""}`:""; $("gSelActions").style.display=n?"flex":"none";
    $("gSelAll").classList.toggle("on", L.length>0 && L.every(e=>GSEL.has(e.id)));
    $("gastBody").querySelectorAll("[data-sel]").forEach(s=>s.onclick=()=>{const id=s.dataset.sel; if(GSEL.has(id))GSEL.delete(id);else GSEL.add(id); gdraw();});
    $("gastBody").querySelectorAll("[data-edx]").forEach(b=>b.onclick=()=>editExpenseModal(exp.find(x=>x.id===b.dataset.edx)));
    $("gastBody").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("¿Eliminar gasto?")){await trashDel("expenses",b.dataset.del);await refreshState();go("gastos");}});
  }
  const gToggle=()=>{const all=gvis.length>0&&gvis.every(e=>GSEL.has(e.id)); if(all)gvis.forEach(e=>GSEL.delete(e.id));else gvis.forEach(e=>GSEL.add(e.id)); gdraw();};
  $("impGastos").onclick=importGastos;
  $("tplGastos").onclick=downloadGastosTemplate;
  $("newExp").onclick=()=>{
    modal("Registrar gasto",`
      <div class="row2"><div class="field"><label>Fecha de ingreso</label><input type="date" id="g_fecha" value="${todayStr()}"></div>
      <div class="field"><label>Categoría</label><select id="g_cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
      <div class="field"><label>Tipo de gasto</label><select id="g_tipo"><option value="fijo">Fijo</option><option value="variable">Variable</option></select></div>
      <div class="field"><label>Descripción</label><input id="g_desc"></div>
      <div class="field"><label>Monto</label><input id="g_monto" inputmode="decimal"></div>
    `,[{label:"Guardar",cls:"btn",fn:async close=>{
      const monto=parseFloat($("g_monto").value)||0; if(monto<=0){toast("Ingresá un monto","bad");return;}
      await DB.put("expenses",{id:uid(),fecha:$("g_fecha").value,fechaRegistro:new Date().toISOString(),categoria:$("g_cat").value,tipo:$("g_tipo").value,descripcion:$("g_desc").value.trim(),monto,caja:"fisica",usuario:APP.user.id,turnoId:APP.openShift?APP.openShift.id:null});
      close(); toast("Gasto registrado","ok"); go("gastos");
    }}]);
    const setTipo=()=>{ $("g_tipo").value=GASTO_TIPO_DEF[$("g_cat").value]||"fijo"; };
    setTipo(); $("g_cat").onchange=setTipo;
  };
  $("gAnal").onclick=()=>gastosAnalysis();
  $("expCsv").onclick=()=>{const rows=[["fecha","categoria","tipo","grupo","descripcion","monto","caja","usuario"]];exp.forEach(e=>rows.push([e.fecha,e.categoria,e.tipo||"fijo",grupoGasto(e.categoria),e.descripcion,e.monto,e.caja||"fisica",userName(e.usuario)]));downloadCSV("gastos-"+todayStr()+".csv",rows);};
  $("expGastos").onclick=()=>{const rows=[["Fecha de Pago","Descripción","Monto","Categoria","Tipo"]];exp.forEach(e=>rows.push([(e.fecha||"").slice(0,10),e.descripcion,e.monto,e.categoria,e.tipo==="variable"?"Variable":"Fijo"]));downloadXLSX("gastos-"+todayStr()+".xlsx","Gastos",rows);};
  $("gCat").onchange=gdraw; $("gTipo").onchange=gdraw; $("gMes").onchange=gdraw;
  $("gSelAll").onclick=gToggle; $("gSelAllLbl").onclick=gToggle;
  $("gSelClear").onclick=()=>{GSEL.clear();gdraw();};
  $("gSelDel").onclick=async()=>{const ids=[...GSEL]; if(!ids.length)return; if(!confirm(`¿Seguro que querés borrar ${ids.length} gasto${ids.length>1?"s":""}? Esta acción NO se puede deshacer.`))return; for(const id of ids) await trashDel("expenses",id); GSEL.clear(); await refreshState(); toast(`${ids.length} gasto${ids.length>1?"s":""} borrado${ids.length>1?"s":""}`,"ok"); go("gastos");};
  gdraw();
}

async function viewReportes(v){

    expenses.forEach(e=>{ gGrupo[grupoGasto(e.categoria)]=(gGrupo[grupoGasto(e.categoria)]||0)+e.monto; (e.tipo==="variable"?gTipo.variable+=e.monto:gTipo.fijo+=e.monto); });

    const porMetodo={};

          ${Object.entries(cat).sort((a,b)=>b[1].venta-a[1].venta).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${money(o.venta)}</td><td class="num">${money(o.venta-o.costo)}</td></tr>`).join("")||`<tr><td colspan="3"><div class="empty">Sin datos.</div></td></tr>`}

        <thead><tr><th>Producto</th><th class="num">Unid.</th><th class="num">Venta</th><th class="num">Margen</th><th class="num">Margen %</th></tr></thead><tbody>

async function applyAudit(rows){
  if(!rows || !rows.length) return;
  let ajustados=0, mermas=0;
  for(const r of rows){
    const p=await DB.get("products", r.id); if(!p) continue;
    const sistema=p.stock, real=+r.real;
    if(!isFinite(real)) continue;
    const diff=real-sistema;
    if(diff===0) continue;
    p.stock=real; await DB.put("products",p);
    ajustados++;
    if(diff<0){
      await DB.put("perdidas",{id:uid(),fecha:new Date().toISOString(),productId:p.id,productoNombre:p.descripcion,cantidad:(sistema-real),motivo:"Merma de inventario",costoUnit:p.costoProm,usuario:APP.user.id});
      mermas++;
    }
  }
  await refreshState();
  toast(`Auditoría aplicada: ${ajustados} ajustados · ${mermas} con merma`,"ok");
  if(APP.page==="auditoria") go("auditoria");
}

function svgDonut(segs){
  const size=210, r=size/2, ir=r*0.62, cx=r, cy=r;
  const total=segs.reduce((a,s)=>a+s.value,0);
  if(total<=0) return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%"><circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none" stroke="#eee" stroke-width="${r-ir}"/></svg>`;
  let ang=-Math.PI/2;
  const arcs=segs.filter(s=>s.value>0).map(s=>{
    const a0=ang, a1=ang+(s.value/total)*2*Math.PI; ang=a1;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1), xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);
    return `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${ir} ${ir} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${s.color}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%">${arcs}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="#999">Total</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="16" font-weight="800" fill="#333">${money(total)}</text></svg>`;
}

const APORTE_MOTIVOS=["Aporte socios","Aporte terceros","Otro"];
async function viewAportes(v){
  if(APP.user.rol!=="propietario" && APP.user.rol!=="gerente"){ v.innerHTML=`<div class="help">Solo propietarios o gerentes pueden ver Aportes de capital.</div>`; return; }
  const list=(await DB.all("aportes")).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const SEL=new Set();
  const total=list.reduce((a,x)=>a+(+x.monto||0),0);
  const socios=list.filter(x=>x.motivo==="Aporte socios").reduce((a,x)=>a+(+x.monto||0),0);
  const terceros=list.filter(x=>x.motivo==="Aporte terceros").reduce((a,x)=>a+(+x.monto||0),0);
  v.innerHTML=`
    <div class="help">Ingresos de dinero que <b>no son ventas</b>: aportes de socios o de terceros. Impactan en el <b>flujo de fondos</b> (financiación) y en el <b>balance</b> (patrimonio).</div>
    <div class="grid kpis">
      <div class="kpi"><div class="lab">Total aportado</div><div class="val">${money(total)}</div></div>
      <div class="kpi ok"><div class="lab">Aporte de socios</div><div class="val">${money(socios)}</div></div>
      <div class="kpi warn"><div class="lab">Aporte de terceros</div><div class="val">${money(terceros)}</div></div>
    </div>
    <div class="toolbar" style="margin-top:12px"><button class="btn" id="addAp">+ Registrar aporte</button></div>
    <div class="selbar">
      <div style="display:flex;align-items:center;gap:9px"><span class="selcirc" id="apSelAll"></span><span class="sellabel" id="apSelAllLbl">Seleccionar todo</span><span class="mini" id="apSelCount"></span></div>
      <div id="apSelActions" style="display:none;gap:8px"><button class="btn sm danger" id="apSelDel">🗑 Borrar seleccionados</button><button class="btn sm gray" id="apSelClear">Cancelar</button></div>
    </div>
    <div class="card"><div class="card-b flush"><div class="tbl-wrap"><table>
      <thead><tr><th class="selcol"></th><th>Fecha</th><th>Descripción</th><th>Proviene de</th><th class="num">Monto</th><th>Motivo</th><th></th></tr></thead>
      <tbody id="apBody"></tbody></table></div></div></div>`;
  function draw(){
    $("apBody").innerHTML=list.map(a=>{const on=SEL.has(a.id);return `<tr class="${on?'selrow':''}">
      <td class="selcol"><span class="selcirc ${on?'on':''}" data-sel="${a.id}"></span></td>
      <td>${a.fecha?fmtDate(a.fecha):"—"}</td>
      <td>${esc(a.descripcion||"—")}</td>
      <td>${esc(a.proviene||"—")}</td>
      <td class="num" style="font-weight:700">${money(a.monto)}</td>
      <td><span class="badge ${a.motivo==="Aporte socios"?'ok':a.motivo==="Aporte terceros"?'warn':'cel'}">${esc(a.motivo||"—")}</span></td>
      <td class="right"><button class="btn sm gray" data-ed="${a.id}">Editar</button></td></tr>`;}).join("")||`<tr><td colspan="7"><div class="empty">Todavía no hay aportes cargados.</div></td></tr>`;
    $("apBody").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>aporteModal(list.find(a=>a.id===b.dataset.ed)));
    $("apBody").querySelectorAll("[data-sel]").forEach(s=>s.onclick=()=>{const id=s.dataset.sel; if(SEL.has(id))SEL.delete(id);else SEL.add(id); draw();});
    const n=SEL.size; $("apSelCount").textContent=n?`· ${n} seleccionado${n>1?"s":""}`:""; $("apSelActions").style.display=n?"flex":"none";
    $("apSelAll").classList.toggle("on", list.length>0 && list.every(a=>SEL.has(a.id)));
  }
  const toggle=()=>{const all=list.length>0&&list.every(a=>SEL.has(a.id)); if(all)SEL.clear();else list.forEach(a=>SEL.add(a.id)); draw();};
  $("apSelAll").onclick=toggle; $("apSelAllLbl").onclick=toggle;
  $("apSelClear").onclick=()=>{SEL.clear();draw();};
  $("apSelDel").onclick=async()=>{const ids=[...SEL]; if(!ids.length)return; if(!confirm(`¿Seguro que querés borrar ${ids.length} aporte${ids.length>1?"s":""}? Esta acción NO se puede deshacer.`))return; for(const id of ids) await trashDel("aportes",id); SEL.clear(); await refreshState(); toast(`${ids.length} aporte${ids.length>1?"s":""} borrado${ids.length>1?"s":""}`,"ok"); go("aportes");};
  $("addAp").onclick=()=>aporteModal(null);
  draw();
}

    </div>

  `,[
    {label:"Borrar",cls:"btn danger sm",fn:async close=>{ if(confirm("¿Borrar este pago de concesión? Se va a la papelera.")){ await trashDel("concesiones",d.id); await refreshState(); close(); toast("Enviado a la papelera","ok"); go("concesiones"); } }},
    {label:"Guardar",cls:"btn",fn:async close=>{ d.monto=parseNum($("ec_m").value)||0; d.metodoPago=$("ec_met").value; d.paidFecha=($("ec_f").value?$("ec_f").value+"T12:00:00.000Z":d.paidFecha); d.caja=(d.metodoPago==="efectivo"?"fisica":null); await DB.put("concesiones",d); await refreshState(); close(); toast("Pago actualizado","ok"); go("concesiones"); }}

function pagarConcesion(deuda){
  if(!deuda) return;
  let met="efectivo";
  const METS=["efectivo","tarjeta","transferencia"];
  modal("Pagar concesión",`
    <div class="mini">Le pagás a <b>${esc(deuda.proveedor||"—")}</b> por <b>${esc(deuda.desc)}</b> (${deuda.cant} unidad${deuda.cant>1?"es":""}).</div>
    <div style="font-size:26px;font-weight:800;color:var(--orange);text-align:center;margin:12px 0">${money(deuda.monto)}</div>
    <label>¿Con qué método pagaste?</label>
    <div class="pay-methods" id="cpMet">${METS.map(k=>`<div class="pm ${k==="efectivo"?"sel":""}" data-cm="${k}"><div class="pmi">${PAY_ICON[k]||""}</div>${PAY_LABEL[k]}</div>`).join("")}</div>
    <div class="mini" id="cpNote" style="margin-top:8px">Sale de la caja física (egreso de efectivo).</div>
  `,[{label:"Confirmar pago",cls:"btn",fn:async close=>{
    if(met==="efectivo"){
      if(!APP.openShift){ toast("Abrí un turno para registrar la salida de efectivo","bad"); return; }
      if(!soyDuenoTurno()){ toast("La caja la maneja quien tiene el turno abierto","bad"); return; }
      await DB.put("movimientos",{id:uid(),tipo:"salida",monto:deuda.monto,motivo:"Pago concesión · "+deuda.desc+(deuda.proveedor?" ("+deuda.proveedor+")":""),fecha:new Date().toISOString(),usuario:APP.user.id,turnoId:APP.openShift.id});
    }
    deuda.pagada=true; deuda.metodoPago=met; deuda.paidFecha=new Date().toISOString(); deuda.caja=(met==="efectivo"?"fisica":null);
    await DB.put("concesiones",deuda); await refreshState(); close(); toast("Deuda saldada · "+PAY_LABEL[met],"ok"); go("concesiones");
  }}]);
  setTimeout(()=>{ document.querySelectorAll("#cpMet [data-cm]").forEach(n=>n.onclick=()=>{ met=n.dataset.cm; document.querySelectorAll("#cpMet .pm").forEach(x=>x.classList.remove("sel")); n.classList.add("sel"); const el=$("cpNote"); if(el) el.textContent=met==="efectivo"?"Sale de la caja física (egreso de efectivo).":"No afecta la caja física (pago electrónico)."; }); },40);
}

function tzValorEnFecha(evs, fecha, fallback){

  return c;
}

function svgBars(data, opt){

async function viewRepFlujo(v){
  const sales=(await DB.all("sales")).filter(s=>!s.anulada);

  v.innerHTML=`<div class="help">Flujo de fondos mensual (base <b>caja</b>: entradas y salidas reales de dinero). Ordenado por actividad. Filtrá el año y mirá los 12 meses uno al lado del otro.</div>
    <div class="toolbar"><div class="field" style="margin:0"><label>Año</label><select id="ff_y">${years.map(y=>`<option>${y}</option>`).join("")}</select></div></div><div id="ff_out"></div>`;

    movs.forEach(x=>{ const m=mi(x.fecha); if(m<0)return; if(x.tipo==="entrada") entradas[m]+=x.monto; else salidas[m]+=x.monto; });
    purchases.forEach(c=>{ if(c.concesion) return; if(c.formaPago==="contado"){ const m=mi(c.fecha); if(m>=0) comprasPag[m]+=(c.total||0); } else if(c.pagada){ const m=mi(c.paidFecha||c.fecha); if(m>=0) pagosProv[m]+=(c.total||0); } });
    expenses.forEach(e=>{ const m=mi(e.fecha); if(m<0)return; if(e.tipo==="fijo") gastosFijos[m]+=e.monto; else gastosVar[m]+=e.monto; });

    const totIng=z().map((_,m)=>ventasEfe[m]+ventasEle[m]+entradas[m]);

    const flujoOp=z().map((_,m)=>totIng[m]-totEgr[m]);
    const flujoNeto=z().map((_,m)=>flujoOp[m]-invers[m]-activCapex[m]+aportes[m]);
    let ac=0; const acum=flujoNeto.map(x=>{ ac+=x; return ac; });
    const filas=[

      {label:"Ventas en efectivo",data:ventasEfe},
      {label:"Ventas tarjeta / transferencia",data:ventasEle},

      {tipo:"total",label:"Total ingresos",data:totIng,color:"#1f8a48"},
      {tipo:"header",label:"Egresos operativos"},
      {label:"Compras de mercadería (contado)",data:comprasPag},
      {label:"Pagos a proveedores (crédito)",data:pagosProv},
      {label:"Gastos fijos",data:gastosFijos},
      {label:"Gastos variables",data:gastosVar},
      {label:"Salidas de efectivo (caja)",data:salidas},
      {tipo:"total",label:"Total egresos operativos",data:totEgr,color:"#c0392b"},
      {tipo:"total",label:"Flujo operativo",data:flujoOp,color:"#2E86DE"},
      {tipo:"header",label:"Inversiones"},
      {label:"Inversiones (acciones, cripto, plazo fijo…)",data:invers},
      {label:"Inversión en activos fijos",data:activCapex},
      {tipo:"header",label:"Financiación"},
      {label:"Aportes de capital (socios / terceros)",data:aportes,color:"#1f8a48"},

      {tipo:"total",label:"Flujo acumulado",data:acum,color:"#8E44AD"},

    $("ff_out").innerHTML=matrizMensual("Concepto / mes ("+Y+")",filas);
  };
  $("ff_y").onchange=render; render();
}
async function viewRepResultados(v){

  const years=_yearsData(sales,expenses,perdidas);
  v.innerHTML=`<div class="help">Estado de resultados mensual (base <b>devengado</b>): la ganancia real del negocio. Usa el <b>CMV</b> (costo de lo vendido), no las compras. Las inversiones no son gasto, no entran acá.</div>
    <div class="toolbar"><div class="field" style="margin:0"><label>Año</label><select id="er_y">${years.map(y=>`<option>${y}</option>`).join("")}</select></div></div><div id="er_out"></div>`;
  const render=()=>{
    const Y=$("er_y").value, mi=f=>_mesIdx(f,Y), z=()=>Array(12).fill(0);
    const ventas=z(), cmv=z(), gAdm=z(), gCom=z(), gMan=z(), gMkt=z(), perd=z();
    sales.forEach(s=>{ const m=mi(s.fecha); if(m<0)return; ventas[m]+=s.total; cmv[m]+=(s.costoTotal||0); });
    expenses.forEach(e=>{ const m=mi(e.fecha); if(m<0)return; const g=grupoGasto(e.categoria); if(g==="Activos")return; if(g==="Comerciales")gCom[m]+=e.monto; else if(g==="Mantenimiento")gMan[m]+=e.monto; else if(g==="Marketing")gMkt[m]+=e.monto; else gAdm[m]+=e.monto; });
    perdidas.forEach(x=>{ const m=mi(x.fecha); if(m>=0) perd[m]+=(x.cantidad||0)*(x.costoUnit||0); });
    const margen=z().map((_,m)=>ventas[m]-cmv[m]);
    const totGastos=z().map((_,m)=>gAdm[m]+gCom[m]+gMan[m]+gMkt[m]);
    const resOp=z().map((_,m)=>margen[m]-totGastos[m]);
    const resNeto=z().map((_,m)=>resOp[m]-perd[m]);
    const filas=[
      {label:"Ventas",data:ventas},
      {label:"(−) CMV (costo de lo vendido)",data:cmv.map(x=>-x),color:"#c0392b"},
      {tipo:"total",label:"= Margen bruto",data:margen,color:"#1f8a48"},
      {tipo:"header",label:"Gastos operativos"},
      {label:"Pagos Administrativos",data:gAdm.map(x=>-x)},
      {label:"Pagos Comerciales (sueldos)",data:gCom.map(x=>-x)},
      {label:"Pagos de Mantenimiento",data:gMan.map(x=>-x)},
      {label:"Pagos de Marketing",data:gMkt.map(x=>-x)},
      {tipo:"total",label:"= Resultado operativo",data:resOp,color:"#2E86DE"},
      {label:"(−) Pérdidas de inventario",data:perd.map(x=>-x),color:"#c0392b"},
      {tipo:"total",label:"= Resultado neto",data:resNeto,color:"#8E44AD"},
    ];
    $("er_out").innerHTML=matrizMensual("Concepto / mes ("+Y+")",filas);
  };
  $("er_y").onchange=render; render();
}
async function viewRepBalance(v){
  const products=APP.products;
  const purchases=await DB.all("purchases"), inversiones=await DB.all("inversiones"), aportesArr=await DB.all("aportes"), activosArr=await DB.all("activos");
  const sales=(await DB.all("sales")).filter(s=>!s.anulada), expenses=await DB.all("expenses"), movs=await DB.all("movimientos");
  const aportesTot=aportesArr.reduce((a,x)=>a+(+x.monto||0),0);
  const activFijos=activosArr.filter(a=>a.propiedad!=="Comodato").reduce((s,a)=>s+(+a.costo||0)*(+a.cantidad||1),0);
  const invValor=products.reduce((a,p)=>a+(p.stock*(p.costoProm||0)),0);
  const invTotal=inversiones.reduce((a,x)=>a+(x.monto||0),0);
  const conces=await DB.all("concesiones");
  const deudaConces=conces.filter(d=>!d.pagada).reduce((a,d)=>a+(+d.monto||0),0);
  const cxp=purchases.filter(c=>c.formaPago==="credito"&&!c.pagada).reduce((a,c)=>a+(c.total||0),0)+deudaConces;
  let efe=0;
  sales.forEach(s=>{ (s.pagos&&s.pagos.length?s.pagos:[{metodo:s.metodoPago,monto:s.total}]).forEach(p=>{ if(p.metodo==="efectivo") efe+=p.monto; }); });
  movs.forEach(x=>{ if(x.tipo==="entrada") efe+=(x.monto||0); else efe-=(x.monto||0); });
  efe+=aportesTot;
  efe-=activFijos;
  expenses.forEach(e=>{ efe-=(e.monto||0); });
  purchases.forEach(c=>{ if(c.formaPago==="contado") efe-=(c.total||0); else if(c.pagada) efe-=(c.total||0); });
  efe=Math.round(efe);
  const activo=efe+invValor+invTotal+activFijos;
  const patrimonio=activo-cxp;
  const row=(l,val,opts)=>`<tr style="${opts&&opts.tot?'font-weight:800;background:#faf7f3':''}"><td style="${opts&&opts.col?'color:'+opts.col:''}">${esc(l)}</td><td class="num" style="${opts&&opts.col?'color:'+opts.col+';':''}${opts&&opts.tot?'font-weight:800':''}">${money(Math.round(val))}</td></tr>`;
  v.innerHTML=`
    <div class="help">Balance <b>al día de hoy</b> (foto del momento): qué tiene y qué debe el negocio. Se calcula solo con lo cargado en el sistema.</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;align-items:start">
      <div class="card"><div class="card-h"><h3>Activo (lo que tiene)</h3></div><div class="card-b flush"><div class="tbl-wrap"><table><tbody>
        ${row("Efectivo operativo (estimado)",efe)}
        ${row("Inventario valorizado (stock × costo)",invValor)}
        ${row("Inversiones",invTotal)}
        ${row("Activos fijos (propios)",activFijos)}
        ${row("Total activo",activo,{tot:true,col:"#1f8a48"})}
      </tbody></table></div></div></div>
      <div class="card"><div class="card-h"><h3>Pasivo y patrimonio</h3></div><div class="card-b flush"><div class="tbl-wrap"><table><tbody>
        ${row("Cuentas por pagar (proveedores)",cxp,{col:"#c0392b"})}
        ${row("Total pasivo",cxp,{tot:true,col:"#c0392b"})}
        ${row("Aportes de capital (socios/terceros)",aportesTot)}
        ${row("Resultados acumulados",patrimonio-aportesTot)}
        ${row("Patrimonio neto (activo − pasivo)",patrimonio,{tot:true,col:"#8E44AD"})}
      </tbody></table></div></div></div>
    </div>
    <div class="help" style="margin-top:14px;background:#fdf6ec;border-color:#f0dcae;color:#8a6d1e">Aclaración honesta: el <b>efectivo</b> es una estimación del acumulado histórico de caja e incluye los aportes de capital que hayas registrado (no contempla retiros que no hayas cargado). Las <b>inversiones</b> figuran como activo aparte: si salieron de la caja del negocio, no lo cuentes doble. Para un balance contable formal harían falta más datos (capital, amortizaciones), pero esta foto ya te sirve para ver patrimonio, deuda e inventario.</div>`;
}

          <div class="field"><label>Hasta</label><input type="date" id="del_d2"></div>
        </div>
        <button class="btn danger" id="delRange">🗑 Borrar datos del rango</button>
        <div class="sectitle">Borrar TODO</div>
        <div class="mini" style="margin-bottom:8px">Elimina productos, combos, proveedores y todas las transacciones. Deja intactos los usuarios para poder seguir ingresando.</div>
        <button class="btn danger" id="delAll">🗑 Borrar TODOS los datos</button>
      </div>
    </div>
    `;
  $("connState").innerHTML = navigator.onLine ? '<span class="badge ok">En línea · sincronizando</span>' : '<span class="badge warn">Sin conexión · se sincroniza al volver</span>';
  $("cloudOut").onclick=async()=>{ if(confirm("¿Cerrar sesión de la nube en este dispositivo? Vas a tener que volver a ingresar el email y contraseña.")){ try{await _auth.signOut();}catch(e){} location.reload(); } };
  $("bkExport").onclick=async()=>{
    const data=await exportObject();
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="tres-y-punto-backup-"+todayStr()+".json"; a.click();
    toast("Copia descargada","ok");
  };
  $("bkImport").onclick=async()=>{
    const f=$("bkFile").files[0]; if(!f){toast("Elegí un archivo","bad");return;}
    if(!confirm("Esto REEMPLAZA todos los datos en la nube (en todos los dispositivos) por los del archivo. ¿Continuar?")) return;
    try{
      const data=JSON.parse(await f.text());
      for(const s of DB.STORES){ if(Array.isArray(data[s])){ await DB.clear(s); for(const item of data[s]) await DB.put(s,item); } }
      toast("Datos importados a la nube","ok"); await refreshState(); buildNav(); go("dashboard");
    }catch(e){ toast("Archivo inválido","bad"); }
  };
  const _DELPASS="Palomos123";
  const _chkPass=()=>{ const p=($("delPass")&&$("delPass").value)||""; if(p!==_DELPASS){ toast("Contraseña incorrecta","bad"); return false; } return true; };
  if($("delRange")) $("delRange").onclick=async()=>{
    if(!_chkPass()) return;
    const d1=$("del_d1").value, d2=$("del_d2").value;
    if(!d1||!d2||d1>d2){ toast("Elegí un rango de fechas válido","bad"); return; }
    if(!confirm("Vas a borrar TODAS las transacciones entre "+d1+" y "+d2+". Esta acción no se puede deshacer. ¿Continuar?")) return;
    const stores=["sales","purchases","expenses","movimientos","ajustes","perdidas","cashCloses","inversiones","priceHistory","shifts"];
    let n=0;
    for(const s of stores){ const all=await DB.all(s); for(const it of all){ const f=String(it.fecha||it.apertura||"").slice(0,10); if(f && f>=d1 && f<=d2){ await DB.del(s,it.id); n++; } } }
    await refreshState(); buildNav(); toast("Borrados "+n+" registros del rango","ok"); go("backup");
  };
  if($("delAll")) $("delAll").onclick=async()=>{
    if(!_chkPass()) return;
    if(!confirm("Vas a borrar ABSOLUTAMENTE TODO (productos, ventas, compras, caja, gastos, inversiones, activos y todo lo cargado) y dejarlo como nuevo. Se conservan SOLO los usuarios para poder ingresar. Esta acción NO se puede deshacer. ¿Continuar?")) return;
    if(!confirm("Confirmación final: ¿borrar todo y empezar de cero?")) return;
    const btn=$("delAll"); if(btn){ btn.disabled=true; btn.textContent="Borrando todo…"; }
    try{
      const cloud = (typeof _db!=="undefined" && _db);
      const keep={users:1};
      for(const s of DB.STORES){ if(keep[s]||s==="meta") continue; await _nukeCollection(s); }
      // meta: dejar sólo el flag anti-demo
      await _nukeCollection("meta");
      await DB.put("meta",{id:"noDemoSeed",v:1});
      if(cloud){ try{ await _db.collection("meta").doc("noDemoSeed").set({id:"noDemoSeed",v:1}); }catch(e){} if(typeof MIRROR!=="undefined") MIRROR["meta"]=[{id:"noDemoSeed",v:1}]; }
      toast("Todo borrado. Reiniciando en limpio…","ok");
      setTimeout(()=>location.reload(), 900);
    }catch(e){ toast("Error al borrar: "+(e.message||e),"bad"); if(btn){ btn.disabled=false; btn.textContent="🗑 Borrar TODOS los datos"; } }
  };
}

function modal(title,bodyHTML,buttons,cls){
  const root=$("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal ${cls||""}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="x" id="mX">×</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f" id="mF"></div></div></div>`;
  const close=()=>{root.innerHTML="";};
  $("mX").onclick=close;
  // No cerrar al hacer click en el fondo: solo con la X o los botones de acción.
  const f=$("mF");
  (buttons||[{label:"Cerrar",cls:"btn gray",fn:c=>c()}]).forEach(b=>{
    const btn=document.createElement("button"); btn.className=b.cls||"btn"; btn.textContent=b.label;
    btn.onclick=()=>b.fn(close); f.appendChild(btn);
  });
}
function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(c=>{c=String(c==null?"":c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(";")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  toast("CSV exportado","ok");
}

function parseConfig(text){
  let t=(text||"").trim();
  if(!t) throw new Error("vacio");
  let start=-1;
  const k=t.indexOf("firebaseConfig");
  if(k>=0) start=t.indexOf("{",k);
  if(start<0){ const a=t.indexOf("apiKey"); if(a>=0) start=t.lastIndexOf("{",a); }
  if(start<0) start=t.indexOf("{");
  if(start<0) throw new Error("sin objeto");
  let depth=0,end=-1;
  for(let i=start;i<t.length;i++){
    const c=t[i];
    if(c==="{") depth++;
    else if(c==="}"){ depth--; if(depth===0){ end=i; break; } }
  }
  if(end<0) throw new Error("sin cierre");
  const obj=Function("return ("+t.slice(start,end+1)+")")();
  if(!obj || !obj.apiKey || !obj.projectId) throw new Error("config incompleta");
  return obj;
}

function showAuthScreen(){
  mountOverlay(`
    <div class="brandmark"><div class="logo3">3·</div><div class="wordmark">Tres y <span class="o">Punto</span></div></div>
    <div class="login-sub">Ingresá con la cuenta del negocio</div>

    <div class="field" style="text-align:left"><label>Contraseña</label><input id="authPass" type="password" autocomplete="current-password"></div>
    <div class="err" id="authErr"></div>
    <button class="btn" style="width:100%;margin-bottom:8px" id="authIn">Ingresar</button>
    <button class="btn gh" style="width:100%" id="authUp">Crear cuenta (primera vez)</button>
    <div class="mini" style="margin-top:10px"><a href="#" id="authForgot" style="color:var(--muted)">Olvidé mi contraseña</a> · <a href="#" id="cfgReset" style="color:var(--muted)">Cambiar configuración de Firebase</a></div>`);
  const mail=()=>$("authMail").value.trim(), pass=()=>$("authPass").value;
  const chk=()=>{ if(!mail()){ $("authErr").textContent="Escribí el email de la cuenta."; return false; } if(!pass()){ $("authErr").textContent="Escribí una contraseña (mínimo 6 caracteres)."; return false; } return true; };
  $("authIn").onclick=async()=>{ $("authErr").textContent=""; if(!chk())return; try{ await _auth.signInWithEmailAndPassword(mail(),pass()); }catch(e){ $("authErr").textContent=authMsg(e); } };
  $("authUp").onclick=async()=>{ $("authErr").textContent=""; if(!chk())return; try{ await _auth.createUserWithEmailAndPassword(mail(),pass()); }catch(e){ $("authErr").textContent=authMsg(e); } };
  $("authForgot").onclick=async e=>{
    e.preventDefault(); $("authErr").textContent="";
    if(!mail()){ $("authErr").textContent="Escribí primero el email de la cuenta."; return; }
    try{ await _auth.sendPasswordResetEmail(mail()); $("authErr").style.color="var(--ok)"; $("authErr").textContent="Te mandamos un correo para poner una contraseña nueva. Revisá tu bandeja (y el spam)."; }
    catch(err){ $("authErr").style.color=""; $("authErr").textContent=authMsg(err); }
  };
  $("cfgReset").onclick=e=>{ e.preventDefault(); localStorage.removeItem("tp_fbconfig"); location.reload(); };
}
function authMsg(e){
  const c=(e&&e.code)||""; 
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "Email o contraseña incorrectos.";
  if(c.includes("email-already-in-use")) return "Esa cuenta ya existe. Probá Ingresar.";
  if(c.includes("weak-password")) return "La contraseña debe tener al menos 6 caracteres.";
  if(c.includes("invalid-email")) return "Email inválido.";
  if(c.includes("missing-password")) return "Escribí una contraseña (mínimo 6 caracteres).";
  if(c.includes("missing-email")) return "Escribí el email de la cuenta.";
  return (e&&e.message)||"No se pudo conectar.";
}

if(!FB_CONFIG && HARDCODED_CONFIG) FB_CONFIG=HARDCODED_CONFIG;

(async function boot(){
  $("login").classList.add("hidden"); $("app").classList.add("hidden");
  if(typeof firebase==="undefined"){
    document.body.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>No se pudo cargar Firebase</h2><p>La primera vez necesitás conexión a internet para descargar la librería. Conectate y volvé a abrir.</p></div>';
    return;
  }
  if(!FB_CONFIG){ showConfigScreen(); return; }
  try{ firebase.initializeApp(FB_CONFIG); }catch(e){ /* ya inicializada */ }
  _auth=firebase.auth(); _db=firebase.firestore();
  try{ await _db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* multipestaña o no soportado: sigue online */ }
  _auth.onAuthStateChanged(async user=>{
    if(!user){ showAuthScreen(); return; }
    hideOverlays();
    try{
      await startData();
      await seedIfEmpty();
      _ready=true;
      window.__usersCache=await DB.all("users");
      $("login").classList.remove("hidden");
      await renderLogin();
      checkMobile();
    }catch(e){
      console.error(e);
      document.body.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>Error al conectar con la base</h2><p>Revisá que en Firebase tengas <b>Firestore</b> creado y las <b>reglas</b> que permiten acceso a usuarios autenticados.</p><pre>'+esc(e.message||e)+'</pre></div>';
    }
  });
})();
